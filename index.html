<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Map Historia</title>
  <meta name="description" content="Tarihi bir ulus seçin, diplomatik, askeri ve ekonomik kararlarla alternatif tarihinizi yazın.">
  <meta name="theme-color" content="#12161f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Map Historia">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  --bg: #12161f;
  --panel: #1a202c;
  --panel-2: #222a39;
  --line: #2f3a4e;
  --text: #e9e4d6;
  --muted: #9aa3b5;
  --gold: #d9b45b;
  --gold-2: #f1d38a;
  --good: #5cc28a;
  --warn: #e5b545;
  --bad: #e5675a;
  --info: #8fb3e6;
  --ally: #3d7dd8;
  --sea-1: #24476b;
  --sea-2: #142a42;
  --radius: 10px;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --display: 'Cinzel', Georgia, 'Times New Roman', serif;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 var(--font);
  overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.pad { padding: 4px 16px; }
.tone-good { color: var(--good); }
.tone-warn { color: var(--warn); }
.tone-bad { color: var(--bad); }
.tone-info { color: var(--info); }

/* ------------------------------------------------------------ düğmeler */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--panel-2); cursor: pointer; transition: background .15s, border-color .15s, transform .05s;
}
.btn:hover:not(:disabled) { border-color: var(--gold); background: #2a3447; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn:focus-visible, button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.btn.primary { background: linear-gradient(180deg, #c99d3e, #a77b25); color: #1a1408; border-color: #e0bd6a; font-weight: 600; }
.btn.primary:hover:not(:disabled) { background: linear-gradient(180deg, #ddb04c, #b88a2d); }
.btn.danger { background: #5b2420; border-color: #8a3a32; }
.btn.danger:hover:not(:disabled) { background: #74302a; border-color: var(--bad); }
.btn.ghost { background: transparent; }
.btn.small { padding: 6px 10px; font-size: 13px; }
.btn.tiny { padding: 4px 8px; font-size: 12px; }
.btn.wide { width: 100%; margin-top: 14px; padding: 12px; }
.btn small { opacity: .75; font-size: 11px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.btn-row.end { justify-content: flex-end; }

/* ------------------------------------------------------------ menü */
#screen-menu {
  height: 100%; overflow-y: auto;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(217, 180, 91, .15), transparent 50%),
    radial-gradient(ellipse at 90% 100%, rgba(61, 125, 216, .15), transparent 50%),
    var(--bg);
}
.menu-inner { max-width: 1100px; margin: 0 auto; padding: 48px 20px 32px; }
.menu-head { text-align: center; margin-bottom: 36px; }
.logo {
  font-family: var(--display); font-weight: 800; font-size: clamp(40px, 8vw, 76px);
  letter-spacing: .06em; margin: 0;
  background: linear-gradient(180deg, var(--gold-2), var(--gold) 55%, #9c7425);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.tagline { color: var(--muted); font-size: 17px; margin: 6px 0 20px; }
.section-title { font-family: var(--display); color: var(--gold); letter-spacing: .08em; font-size: 18px; margin: 0 0 14px; }
.scenario-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 18px; }
.scenario-card {
  display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line);
  border-radius: 14px; overflow: hidden; cursor: pointer; transition: transform .15s, border-color .15s, box-shadow .15s;
}
.scenario-card:hover, .scenario-card:focus-visible { transform: translateY(-3px); border-color: var(--gold); box-shadow: var(--shadow); }
.sc-year {
  font-family: var(--display); font-size: 54px; font-weight: 800; color: var(--gold-2); padding: 18px 20px 6px;
  background: linear-gradient(135deg, rgba(217, 180, 91, .18), transparent 70%);
}
.sc-body { padding: 4px 20px 18px; display: flex; flex-direction: column; flex: 1; }
.sc-body h3 { margin: 0; font-size: 20px; }
.sc-sub { color: var(--gold); margin: 2px 0 10px; font-size: 13px; }
.sc-desc { color: var(--muted); margin: 0 0 14px; flex: 1; }
.sc-foot { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); }
.sc-go { color: var(--gold-2); font-weight: 600; }
.menu-foot { margin-top: 32px; text-align: center; color: var(--muted); font-size: 12px; }

/* ------------------------------------------------------------ oyun ekranı */
#screen-game { height: 100%; display: flex; flex-direction: column; }
#topbar {
  display: flex; align-items: center; gap: 16px; padding: 8px 14px;
  background: linear-gradient(180deg, #1f2737, #181e2a); border-bottom: 1px solid var(--line);
  min-height: 56px; flex-wrap: wrap;
}
.tb-nation { display: flex; align-items: center; gap: 10px; min-width: 180px; }
.tb-flag { width: 28px; height: 28px; border-radius: 6px; border: 2px solid rgba(255, 255, 255, .35); flex: none; }
.tb-title { font-family: var(--display); font-weight: 600; font-size: 15px; line-height: 1.1; }
.tb-sub { color: var(--muted); font-size: 12px; }
.tb-stats { display: flex; gap: 14px; flex: 1; flex-wrap: wrap; align-items: center; }
.tb-stats .stat { white-space: nowrap; }
.tb-stats .stat small { font-size: 11px; }
.tb-stats .at-war { color: var(--bad); font-weight: 600; }
.tb-stats .hint { color: var(--muted); }
.tb-time { display: flex; align-items: center; gap: 10px; }
#tb-date { font-family: var(--display); font-weight: 600; min-width: 140px; text-align: right; color: var(--gold-2); }
.speed { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.speed button { background: var(--panel-2); border: 0; padding: 6px 10px; cursor: pointer; font-size: 11px; letter-spacing: -2px; min-width: 38px; }
.speed button + button { border-left: 1px solid var(--line); }
.speed button.active { background: var(--gold); color: #1a1408; }
.speed button:disabled { opacity: .4; cursor: not-allowed; }
.tb-menu { display: flex; gap: 6px; }

#layout { flex: 1; display: grid; grid-template-columns: 1fr 380px; min-height: 0; }
#map-wrap { position: relative; overflow: hidden; background: var(--sea-2); }
#map { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; user-select: none; }
#map.dragging { cursor: grabbing; }
#map .prov { stroke: rgba(0, 0, 0, .1); stroke-width: .35; transition: fill .35s; cursor: pointer; }
#map .prov:hover { filter: brightness(1.18); }
#map .prov.unclaimed { stroke: rgba(80, 60, 20, .12); }
#map .prov.flash { animation: flash 1.3s ease-out; }
@keyframes flash { 0% { filter: brightness(2.2) saturate(1.5); } 100% { filter: none; } }
#map .shallow { fill: none; stroke-linejoin: round; stroke-linecap: round; pointer-events: none; }
#map .shallow-1 { stroke: rgba(120, 190, 235, .14); stroke-width: 14; }
#map .shallow-2 { stroke: rgba(150, 210, 245, .22); stroke-width: 5; }
#map .terrain { mix-blend-mode: multiply; opacity: .32; pointer-events: none; }
#map .coast { fill: none; stroke: rgba(10, 25, 40, .55); stroke-width: .7; pointer-events: none; }
#map .inner-borders { fill: none; stroke: rgba(0, 0, 0, .16); stroke-width: .35; pointer-events: none; }
#map .borders { fill: none; stroke: rgba(12, 12, 16, .85); stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
#map .player-outline { fill: none; stroke: var(--gold-2); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
#map .enemy-outline { fill: none; stroke: #ff5a4a; stroke-width: 1.4; stroke-dasharray: 4 3; pointer-events: none; }
#map .select-outline { fill: none; stroke: #fff; stroke-width: 1.8; stroke-dasharray: 5 3; pointer-events: none; animation: march 1.2s linear infinite; }
@keyframes march { to { stroke-dashoffset: -16; } }
#map .war-hatch { pointer-events: none; opacity: .75; }
#map .capital { fill: #fff; stroke: #111; stroke-width: .8; pointer-events: none; }
#map .capital.is-player { fill: var(--gold-2); }
#map .nation-label {
  font-family: var(--display); font-weight: 700; text-anchor: middle; dominant-baseline: middle;
  fill: rgba(255, 255, 255, .93); stroke: rgba(20, 16, 10, .55); stroke-width: .08em; paint-order: stroke;
  pointer-events: none; letter-spacing: .1em;
}
#map .nation-label.is-player { fill: #fff3c4; }

#map .stack { cursor: pointer; }
#map .stack rect:first-child { stroke: #111; stroke-width: 1; }
#map .stack.mine rect:first-child { stroke: var(--gold-2); stroke-width: 1.6; }
#map .stack.foe rect:first-child { stroke: #ff5a4a; stroke-width: 1.4; }
#map .stack.selected rect:first-child { stroke: #fff; stroke-width: 2.4; }
#map .stack.shattered { opacity: .55; }
#map .stack text { font: 700 6.5px var(--font); text-anchor: middle; dominant-baseline: middle; fill: #fff; stroke: rgba(0, 0, 0, .75); stroke-width: 1.6; paint-order: stroke; pointer-events: none; }
#map .siege-bg { fill: rgba(0, 0, 0, .7); }
#map .siege-fg { fill: #ff7a45; }
#map .army-path { fill: none; stroke: var(--gold-2); stroke-width: 1.4; stroke-dasharray: 3 2.5; opacity: .8; pointer-events: none; }
#map .army-path.selected { stroke-width: 2.4; opacity: 1; }
#map .army-path-end { fill: var(--gold-2); pointer-events: none; }
#order-hint {
  position: absolute; left: 50%; top: 46px; transform: translateX(-50%); padding: 6px 14px; border-radius: 99px;
  background: rgba(217, 180, 91, .95); color: #1a1408; font-weight: 600; font-size: 13px; pointer-events: none; white-space: nowrap;
}
.stack-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.stack-list li { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
.stack-list li.selected { border-color: var(--gold); }
.stack-list .sl-head { display: flex; align-items: center; gap: 8px; }
.stack-list .sl-head b { flex: 1; }
.stack-list .btn-row { margin-top: 6px; }
.sl-status { font-size: 12px; color: var(--muted); }
.sl-status.siege { color: #ff9f6e; }
.sl-status.shattered { color: var(--bad); }

#map .fort-mark { fill: #f1e9c6; stroke: #1a1408; stroke-width: .8; pointer-events: none; }
#map .construction-mark { fill: #ffb347; stroke: #1a1408; stroke-width: .8; pointer-events: none; }
.card.province { border-color: var(--gold); }
.prov-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.prov-head h3 { margin: 0; }
.prov-head p { margin: 2px 0 8px; }
.chip.warn { border-color: var(--warn); }
.build-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
.build { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.build:hover:not(:disabled) { border-color: var(--gold); }
.build:disabled { opacity: .5; cursor: not-allowed; }
.build small { color: var(--muted); font-size: 11px; }
.build span { color: var(--gold-2); font-size: 11px; font-weight: 600; }

#map-tooltip {
  position: absolute; pointer-events: none; background: rgba(18, 22, 31, .95); border: 1px solid var(--line);
  padding: 8px 10px; border-radius: 8px; font-size: 12px; max-width: 240px; box-shadow: var(--shadow); z-index: 5;
}
.map-controls { position: absolute; right: 12px; top: 12px; display: flex; gap: 6px; }
.map-controls button, .map-controls select {
  background: rgba(26, 32, 44, .92); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; min-width: 34px;
}
.legend { position: absolute; left: 12px; bottom: 64px; display: none; gap: 10px; flex-wrap: wrap; background: rgba(18, 22, 31, .85); padding: 6px 10px; border-radius: 8px; font-size: 12px; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.legend i.grad { width: 30px; background: linear-gradient(90deg, rgb(196, 120, 110), rgb(106, 190, 130)); }
#map-wrap:has(#map-mode option[value="diplomatic"]:checked) .legend-diplomatic { display: flex; }

#paused-badge {
  position: absolute; left: 50%; top: 12px; transform: translateX(-50%); padding: 4px 14px; border-radius: 99px;
  background: rgba(0, 0, 0, .55); color: var(--gold-2); font-family: var(--display); letter-spacing: .2em; font-size: 12px;
  display: none; pointer-events: none;
}
#screen-game.paused #paused-badge { display: block; }
#battle-ticker {
  position: absolute; left: 50%; bottom: 18px; transform: translate(-50%, 20px); opacity: 0; transition: .25s;
  padding: 8px 16px; border-radius: 99px; background: rgba(18, 22, 31, .92); border: 1px solid var(--line); pointer-events: none; white-space: nowrap;
}
#battle-ticker.show { opacity: 1; transform: translate(-50%, 0); }
#battle-ticker.good { border-color: var(--good); }
#battle-ticker.bad { border-color: var(--bad); }

/* ------------------------------------------------------------ yan panel */
#side { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
#pick-panel { overflow-y: auto; flex: 1; padding-bottom: 16px; }
#play-panel { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.panel-head { padding: 12px 16px 6px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.panel-head h2 { font-family: var(--display); font-size: 17px; margin: 0; color: var(--gold-2); }
.tabs { display: flex; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; background: none; border: 0; padding: 11px 4px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; font-weight: 500; font-size: 13px; }
.tabs button.active { color: var(--gold-2); border-bottom-color: var(--gold); }
#tab-body { overflow-y: auto; flex: 1; padding: 10px 12px 24px; }

.summary { padding: 6px 16px; }
#tab-body .summary { padding: 0 4px; }
.sum-head { display: flex; gap: 12px; align-items: center; margin: 6px 0 10px; position: relative; }
.sum-head .banner { width: 40px; height: 50px; flex: none; background: var(--nc); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 80%, 0 100%); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .25); }
.sum-head h2 { margin: 0; font-family: var(--display); font-size: 19px; }
.sum-head p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
.sum-head .close { position: absolute; right: 0; top: 0; }
.summary h4 { margin: 14px 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--gold); }
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 0; }
.stat-grid div { background: var(--panel-2); border-radius: 8px; padding: 6px 8px; }
.stat-grid dt { font-size: 11px; color: var(--muted); }
.stat-grid dd { margin: 0; font-weight: 600; font-size: 14px; }
.stat-grid dd small { font-weight: 400; color: var(--muted); }
.card .stat-grid { grid-template-columns: repeat(2, 1fr); margin: 8px 0; }
.dip-rows { display: flex; flex-direction: column; gap: 6px; }
.dip-rows > div { display: grid; grid-template-columns: 82px 1fr; gap: 8px; align-items: start; }
.dip-rows > div > span { color: var(--muted); font-size: 12px; padding-top: 3px; }
.chip { display: inline-block; padding: 2px 8px; margin: 0 4px 4px 0; border-radius: 99px; background: var(--panel-2); border: 1px solid var(--line); font-size: 12px; }
.chip.ally { border-color: var(--ally); }
.chip.enemy { border-color: var(--bad); color: #ffb3aa; }
.chip.trade { border-color: var(--good); }
.chip.good b { color: var(--good); }
.chip.bad b { color: var(--bad); }

.list-title { margin: 18px 16px 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--gold); }
#tab-body .list-title { margin-left: 4px; }
.nation-list { list-style: none; margin: 0; padding: 0 8px; }
.nation-list li { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
.nation-list li:hover, .nation-list li.active { background: var(--panel-2); }
.nation-list li.active { box-shadow: inset 3px 0 0 var(--gold); }
.nation-list.compact li { padding: 5px 8px; }
.swatch { width: 14px; height: 14px; border-radius: 4px; flex: none; border: 1px solid rgba(255, 255, 255, .3); display: inline-block; }
.nl-name { flex: 1; display: flex; flex-direction: column; }
.nl-name small { color: var(--muted); font-size: 11px; }
.nl-meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

.card { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 10px; }
.card h3 { margin: 0 0 8px; font-size: 14px; color: var(--gold-2); }
.card .stat-grid div { background: var(--panel); }
.tax-row { display: flex; gap: 12px; align-items: center; }
.tax-row input { flex: 1; accent-color: var(--gold); }
.tax-row output { font-weight: 700; min-width: 42px; text-align: right; font-size: 16px; }
.budget { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.budget td { padding: 4px 0; border-bottom: 1px solid var(--line); }
.budget td:last-child { text-align: right; }
.budget tr.total td { font-weight: 700; border-bottom: 0; }
.focus-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.focus { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.focus small { color: var(--muted); font-size: 11px; }
.focus.active { border-color: var(--gold); box-shadow: inset 0 0 0 1px var(--gold); }
.focus:disabled { opacity: .45; cursor: not-allowed; }
.rows { list-style: none; margin: 0; padding: 0; }
.rows li { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
.rows li .btn { margin-left: auto; }

.war { border-top: 1px solid var(--line); padding: 8px 0; }
.war:first-of-type { border-top: 0; }
.war-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.score-bar { position: relative; height: 16px; background: var(--panel); border-radius: 99px; margin-top: 6px; overflow: hidden; }
.score-bar::before { content: ''; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--muted); }
.score-bar div { position: absolute; top: 0; bottom: 0; }
.score-bar .pos { background: var(--good); }
.score-bar .neg { background: var(--bad); }
.score-bar span { position: absolute; inset: 0; text-align: center; font-size: 11px; line-height: 16px; font-weight: 700; text-shadow: 0 1px 2px #000; }

.card.target .flags { margin-bottom: 8px; }
.opinion { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.opinion > div { display: grid; grid-template-columns: 100px 1fr 40px; align-items: center; gap: 8px; font-size: 12px; }
.opinion > div > span { color: var(--muted); }
.opinion b { text-align: right; }
.op-bar { position: relative; height: 8px; border-radius: 99px; background: linear-gradient(90deg, var(--bad), #6b6f7a 50%, var(--good)); }
.op-mark { position: absolute; top: -3px; width: 4px; height: 14px; margin-left: -2px; background: #fff; border-radius: 2px; box-shadow: 0 0 0 1px #000; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
.actions .btn { font-size: 13px; padding: 8px 6px; }

.log { list-style: none; margin: 0; padding: 0; font-size: 12.5px; }
.log li { padding: 6px 4px 6px 10px; border-left: 3px solid var(--line); margin-bottom: 4px; }
.log time { display: block; color: var(--muted); font-size: 11px; }
.log .log-war { border-left-color: var(--bad); }
.log .log-good, .log .log-peace { border-left-color: var(--good); }
.log .log-bad { border-left-color: #b4483d; }
.log .log-warn { border-left-color: var(--warn); }
.log .log-event, .log .log-player { border-left-color: var(--gold); }
.log .log-world { border-left-color: var(--info); }

/* ------------------------------------------------------------ duruş, hedefler, kronik */
.stance, .seg { display: flex; margin-top: 8px; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.stance button, .seg button { flex: 1; background: var(--panel); border: 0; padding: 5px 4px; font-size: 12px; cursor: pointer; color: var(--muted); }
.stance button + button, .seg button + button { border-left: 1px solid var(--line); }
.stance button.active, .seg button.active { background: var(--gold); color: #1a1408; font-weight: 600; }
.seg { margin: 0 0 10px; }
.goals { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }

  <script>
/*
 * Map Historia — harita verisi.
 * tools/build-map.js'in ürettiği data/map-<kaynak>.js dosyalarını yükler ve oyunun kullandığı
 * eyalet grafını kurar: her eyaletin merkezi, alanı, kıyı bilgisi, komşuları ve boğaz bağlantıları.
 */
(function (MH) {
  'use strict';

  const LON_KM = 111.32;
  const cache = new Map();
  const loading = new Map();

  /** Tarayıcıda harita verisini <script> ile yükler (file:// üzerinde de çalışır) */
  function load(source) {
    if (MH.MAPDATA?.[source]) return Promise.resolve();
    if (loading.has(source)) return loading.get(source);
    const p = new Promise((resolve, reject) => {
      if (typeof document === 'undefined') return reject(new Error('Harita verisi yüklenmemiş: ' + source));
      const s = document.createElement('script');
      s.src = 'data/map-' + source + '.js';
      s.onload = () => (MH.MAPDATA?.[source] ? resolve() : reject(new Error('Harita verisi okunamadı: ' + source)));
      s.onerror = () => reject(new Error('Harita verisi indirilemedi: ' + source));
      document.head.appendChild(s);
    });
    loading.set(source, p);
    p.catch(() => loading.delete(source));
    return p;
  }

  /** Eyalet grafı (kaynağa göre önbellekli) */
  function gridFor(source) {
    if (cache.has(source)) return cache.get(source);
    const d = MH.MAPDATA?.[source];
    if (!d) throw new Error('Harita verisi yüklenmemiş: ' + source);
    const provinces = d.provinces.map((p, id) => ({
      id,
      x: p[0],
      y: p[1],
      lon: p[2],
      lat: p[3],
      area: p[4],
      polity: p[5],
      coastal: !!p[6],
      neighbors: d.neighbors[id],
      straits: d.straits[id],
    }));
    const { lon0, lat1 } = d.projection;
    const yTop = Math.log(Math.tan(Math.PI / 4 + (lat1 * Math.PI) / 360));
    const project = (lon, lat) => ({
      x: ((lon - lon0) / 360) * d.width,
      y: (yTop - Math.log(Math.tan(Math.PI / 4 + (lat * Math.PI) / 360))) * (d.width / (2 * Math.PI)),
    });

    // Konum tablosu: noktanın içinde bulunduğu eyalet
    let table = null;
    const containing = (lon, lat) => {
      const L = d.lookup;
      if (!L) return -1;
      if (!table) {
        table = L.rle.map((row) => {
          const out = new Int32Array(L.cols).fill(-1);
          let c = 0;
          for (const part of row.split(',')) {
            const [v, n] = part.split('*');
            const len = n ? parseInt(n, 36) : 1;
            const id = v === '' ? -1 : parseInt(v, 36);
            out.fill(id, c, c + len);
            c += len;
          }
          return out;
        });
      }
      const r = Math.floor((lat1 - lat) / L.res);
      const c = Math.floor((lon - lon0) / L.res);
      if (r < 0 || r >= L.rows || c < 0 || c >= L.cols) return -1;
      return table[r][c];
    };

    // Kıyı şehirleri tabloda denize düşebilir: en fazla 2 hücre çevresine bak
    const OFFSETS = [];
    for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) OFFSETS.push([dr, dc, dr * dr + dc * dc]);
    OFFSETS.sort((a, b) => a[2] - b[2]);
    const containingNear = (lon, lat, filter) => {
      const res = d.lookup ? d.lookup.res : 0;
      for (const [dr, dc] of OFFSETS) {
        const id = containing(lon + dc * res, lat - dr * res);
        if (id >= 0 && (!filter || filter(provinces[id]))) return id;
      }
      return -1;
    };

    /** Bir noktayı içeren eyalet; yoksa (deniz ya da filtre dışı) en yakın eyalet */
    const nearest = (lon, lat, filter) => {
      const inside = containingNear(lon, lat, filter);
      if (inside >= 0) return inside;
      let best = -1;
      let bestD = Infinity;
      const k = Math.cos((lat * Math.PI) / 180);
      for (const p of provinces) {
        if (filter && !filter(p)) continue;
        const dl = Math.abs(p.lon - lon);
        const d2 = (Math.min(dl, 360 - dl) * k) ** 2 + (p.lat - lat) ** 2;
        if (d2 < bestD) { bestD = d2; best = p.id; }
      }
      return best;
    };

    /** İki eyalet arası yaklaşık uzaklık (km) */
    const distanceKm = (a, b) => {
      const p = provinces[a];
      const q = provinces[b];
      const k = Math.cos((((p.lat + q.lat) / 2) * Math.PI) / 180);
      const dl = Math.abs(p.lon - q.lon);
      return Math.hypot(Math.min(dl, 360 - dl) * k, p.lat - q.lat) * LON_KM;
    };

    const grid = {
      source,
      year: d.year,
      width: d.width,
      height: d.height,
      provinces,
      polities: d.polities,
      rings: d.rings,
      pairs: d.pairs,
      coast: d.coast,
      project,
      nearest,
      containing,
      containingNear,
      distanceKm,
    };
    cache.set(source, grid);
    return grid;
  }

  const cache = new Map();

  function nameFor(entry, year) {
    const [name, , , opt = {}] = entry;
    if (opt.from && year < opt.from) return null;
    for (const [before, old] of Object.entries(opt.alt || {})) if (year < Number(before)) return old;
    let current = name;
    for (const [since, renamed] of Object.entries(opt.rename || {})) if (year >= Number(since)) current = renamed;
    return current;
  }

  /** Bir harita ve yıl için eyalet → { names, city } tablosu */
  function table(grid, year) {
    const key = grid.source + ':' + year;
    if (cache.has(key)) return cache.get(key);
    const { provinces } = grid;
    const city = new Array(provinces.length).fill(null);
    const placed = [];
    const km = (p, lon, lat) => {
      const k = Math.cos((lat * Math.PI) / 180);
      return Math.hypot((p.lon - lon) * k, p.lat - lat) * 111.32;
    };
    for (const entry of CITIES) {
      const name = nameFor(entry, year);
      if (!name) continue;
      // Şehri içeren eyalet; bulunamazsa merkezi en yakın eyalet (en fazla 260 km)
      let pid = grid.containingNear ? grid.containingNear(entry[1], entry[2]) : -1;
      if (pid < 0) {
        pid = grid.nearest(entry[1], entry[2]);
        if (km(provinces[pid], entry[1], entry[2]) > 260) continue;
      }
      // Eyalet başka bir şehre aitse en yakın boş komşuya kaydır
      if (city[pid]) {
        const free = provinces[pid].neighbors.filter((n) => !city[n] && provinces[n].polity === provinces[pid].polity).sort((a, b) => km(provinces[a], entry[1], entry[2]) - km(provinces[b], entry[1], entry[2]));
        if (!free.length || km(provinces[free[0]], entry[1], entry[2]) > 260) continue;
        pid = free[0];
      }
      city[pid] = name;
      placed.push(pid);
    }
    const names = provinces.map((p) => {
      if (city[p.id]) return city[p.id];
      let best = null;
      let bestD = Infinity;
      for (const c of placed) {
        const d = km(provinces[c], p.lon, p.lat);
        if (d < bestD) { bestD = d; best = c; }
      }
      return best !== null && bestD < 450 ? city[best] + ' yöresi' : null;
    });
    const t = { names, city };
    cache.set(key, t);
    return t;
  }

  /** Eyaletin adı ("Belgrad", "Belgrad yöresi" ya da "<Ulus> taşrası") */
  function nameOf(game, pid) {
    const t = table(game.grid, game.scenario.year);
    if (t.names[pid]) return t.names[pid];
    const owner = game.state.owner[pid];
    return owner ? game.nation(owner).name + ' taşrası' : 'Sahipsiz topraklar';
  }

  function isCity(game, pid) {
    return !!table(game.grid, game.scenario.year).city[pid];
  }

  // Şehrin önem sırası (listede ne kadar öndeyse o kadar önemli)
  const RANK = new Map();
  CITIES.forEach((c, i) => {
    RANK.set(c[0], i);
    for (const v of Object.values(c[3]?.alt || {})) RANK.set(v, i);
    for (const v of Object.values(c[3]?.rename || {})) RANK.set(v, i);
  });
  const rank = (name) => RANK.get(name) ?? 1e9;

  MH.places = { CITIES, nameOf, isCity, table, rank };
})((globalThis.MH = globalThis.MH || {}));
