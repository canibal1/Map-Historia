<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Map Historia</title>
  <meta name="description" content="Tarihi bir ulus seçin, diplomatik, askeri ve ekonomik kararlarla alternatif tarihinizi yazın.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-mode="menu">
  <!-- Ana menü: senaryo seçimi (AC 1.1) -->
  <section id="screen-menu" class="screen">
    <div class="menu-inner">
      <header class="menu-head">
        <h1 class="logo">Map Historia</h1>
        <p class="tagline">Bir ulus seç. Kararlarını ver. Tarihin akışını değiştir.</p>
        <button id="btn-continue" class="btn primary" hidden>Kayıtlı oyuna devam et</button>
      </header>
      <h2 class="section-title">Bir dönem seç</h2>
      <div id="scenario-list" class="scenario-grid"></div>
      <footer class="menu-foot">
        <span>Boşluk: duraklat/devam · 1–3: hız · Fare tekerleği: yakınlaştır · Sürükle: kaydır</span>
      </footer>
    </div>
  </section>

  <!-- Oyun ekranı -->
  <section id="screen-game" class="screen" hidden>
    <header id="topbar">
      <div class="tb-nation" id="tb-nation"></div>
      <div class="tb-stats" id="tb-stats"></div>
      <div class="tb-time">
        <span id="tb-date" aria-live="polite"></span>
        <div class="speed" role="group" aria-label="Oyun hızı">
          <button data-speed="0" title="Duraklat (Boşluk)" aria-label="Duraklat">❚❚</button>
          <button data-speed="1" title="Normal hız (1)" aria-label="Normal hız">▶</button>
          <button data-speed="2" title="Hızlı (2)" aria-label="Hızlı">▶▶</button>
          <button data-speed="3" title="Çok hızlı (3)" aria-label="Çok hızlı">▶▶▶</button>
        </div>
      </div>
      <div class="tb-menu">
        <button id="btn-save" class="btn small">Kaydet</button>
        <button id="btn-menu" class="btn small ghost">Menü</button>
      </div>
    </header>

    <main id="layout">
      <div id="map-wrap">
        <svg id="map" role="img" aria-label="Dünya haritası" preserveAspectRatio="xMidYMid meet"></svg>
        <div id="map-tooltip" hidden></div>
        <div id="paused-badge">DURAKLATILDI</div>
        <div id="battle-ticker"></div>
        <div class="map-controls">
          <select id="map-mode" aria-label="Harita modu">
            <option value="political">Siyasi harita</option>
            <option value="diplomatic">Diplomatik harita</option>
          </select>
          <button id="zoom-in" aria-label="Yakınlaştır">+</button>
          <button id="zoom-out" aria-label="Uzaklaştır">−</button>
          <button id="zoom-reset" aria-label="Tüm harita">⌂</button>
        </div>
        <div class="legend legend-diplomatic">
          <span><i style="background:#f4d35e"></i>Siz</span>
          <span><i style="background:#3d7dd8"></i>Müttefik</span>
          <span><i style="background:#3aa17e"></i>Ticaret</span>
          <span><i style="background:#c0392b"></i>Savaş</span>
          <span><i class="grad"></i>Düşman → dost</span>
        </div>
      </div>

      <aside id="side">
        <!-- Ulus seçimi (AC 1.2, 1.3) -->
        <div id="pick-panel"></div>
        <!-- Yönetim panelleri (AC 2) -->
        <div id="play-panel" hidden>
          <nav class="tabs" role="tablist">
            <button data-tab="overview" role="tab">Ülke</button>
            <button data-tab="economy" role="tab">Ekonomi</button>
            <button data-tab="military" role="tab">Ordu</button>
            <button data-tab="diplomacy" role="tab">Diplomasi</button>
            <button data-tab="log" role="tab">Günlük</button>
          </nav>
          <div id="tab-body"></div>
        </div>
      </aside>
    </main>
  </section>

  <div id="modal" class="modal" hidden>
    <div id="modal-card" class="modal-card" role="dialog" aria-modal="true"></div>
  </div>
  <div id="toasts" aria-live="polite"></div>

  <script src="js/geo.js"></script>
  <script src="js/scenarios.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/events.js"></script>
  <script src="js/goals.js"></script>
  <script src="js/map.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
