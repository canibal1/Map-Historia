          const front = frontierToward(game, id, pid);
          const spots = [front ?? home, home, home];
          const size = nat.army * theaterShare(game, id);
          for (let i = 0; i < k; i++) newStack(game, id, spots[i], size / k, nat.name + (k > 1 ? ' ' + (i + 1) + '. Ordusu' : ' Ordusu'));
        }
      }
      sync(game, id);
    }
  }

  /** `id` ulusunun `toward` ulusuna en yakın eyaleti */
  function frontierToward(game, id, toward) {
    const { provinces } = game.grid;
    const owner = game.state.owner;
    for (let i = 0; i < owner.length; i++) {
      if (owner[i] !== id) continue;
      const p = provinces[i];
      if (p.neighbors.some((nb) => owner[nb] === toward) || p.straits.some((nb) => owner[nb] === toward)) return i;
    }
    return null;
  }

  /**
   * Yapay zekâ ulusunun ordusunun oyuncuya karşı cepheye düşen payı.
   * Aynı anda başka yapay zekâ uluslarıyla da savaşıyorsa ordusu cephelere duruş ağırlığıyla bölünür
   * (engine.js'deki soyut model de aynı bölüşümü kullanır), böylece asker iki kez sayılmaz.
   */
  function theaterShare(game, id) {
    const pid = game.state.playerId;
    if (id === pid) return 1;
    let total = 0;
    let mine = 0;
    for (const w of game.warsOf(id)) {
      const vsPlayer = w.a === pid || w.b === pid;
      if (!vsPlayer && !game._frontier(w.a, w.b).length && !game._frontier(w.b, w.a).length) continue;
      const wt = MH.STANCES[game.stanceOf(w, id)].weight;
      total += wt;
      if (vsPlayer) mine += wt;
    }
    return total && mine ? mine / total : 1;
  }

  /** Ordu toplamını hedefle eşitler: yeni askerler başkentteki orduya katılır, kayıplar orantılı dağılır */
  function sync(game, id) {
    const nat = game.nation(id);
    const mine = stacksOf(game, id);
    if (!mine.length) return;
    const goal = Math.max(0, nat.army) * theaterShare(game, id);
    const total = mine.reduce((s, x) => s + x.size, 0);
    const diff = goal - total;
    if (Math.abs(diff) < 0.05) return;
    if (diff > 0) {
      const home = homeProvince(game, id);
      const target = mine.find((s) => s.prov === home && !s.shattered) || mine.reduce((a, b) => (b.size > a.size ? b : a));
      target.size = round1(target.size + diff);
    } else if (total > 0) {
      const f = goal / total;
      for (const s of mine) s.size = round1(s.size * f);
    }
    for (const s of mine) if (s.size < 0.5) removeStack(game, s);
    // Yuvarlama artığını en büyük orduya yaz
    const left = stacksOf(game, id);
    if (left.length) {
      const sum = left.reduce((s, x) => s + x.size, 0);
      const big = left.reduce((a, b) => (b.size > a.size ? b : a));
      big.size = round1(Math.max(0, big.size + goal - sum));
    }
  }

  // ------------------------------------------------------------------ oyuncu emirleri
  function moveStack(game, sid, target) {
    const stack = stackById(game, sid);
    if (!stack) return game._result(false, 'Ordu bulunamadı.');
    if (stack.owner !== game.state.playerId) return game._result(false, 'Bu ordu sizin değil.');
    if (stack.prov === target) {
      stack.path = [];
      stack.auto = false;
      return game._result(true, stack.name + ' yerinde bekliyor.');
    }
    const ownerOfTarget = game.state.owner[target];
    if (!canEnter(game, stack.owner, target, stack.returning)) {
      return game._result(false, game.nation(ownerOfTarget).name + ' topraklarına giriş izniniz yok (savaş ya da ittifak gerekli).');
    }
    const { dist, prev } = distancesFrom(game, stack.prov, stack.owner, stack.returning);
    if (!isFinite(dist[target])) return game._result(false, 'Oraya giden bir yol yok.');
    stack.path = buildPath(prev, stack.prov, target);
    stack.progress = 0;
    stack.auto = false;
    const days = Math.round(dist[target]);
    const siege = hostile(game, stack.owner, ownerOfTarget) ? ' Varınca kuşatma başlayacak.' : '';
    return game._result(true, stack.name + ' yola çıktı: ~' + days + ' gün.' + siege, [[stack.path.length + ' eyalet', null]]);
  }

  function setAuto(game, sid, auto) {
    const stack = stackById(game, sid);
    if (!stack || stack.owner !== game.state.playerId) return game._result(false, 'Ordu bulunamadı.');
    stack.auto = !!auto;
    stack.think = 0;
    return game._result(true, stack.name + (auto ? ' otomatik komutaya geçti.' : ' artık sizin emirlerinizi bekliyor.'));
  }

  function splitStack(game, sid) {
    const stack = stackById(game, sid);
    if (!stack || stack.owner !== game.state.playerId) return game._result(false, 'Ordu bulunamadı.');
    if (stack.size < 4) return game._result(false, 'Bölünemeyecek kadar küçük.');
    const half = round1(stack.size / 2);
    stack.size = round1(stack.size - half);
    const other = newStack(game, stack.owner, stack.prov, half, nextName(game, stack.owner));
    other.auto = stack.auto;
    other.shattered = stack.shattered;
    return game._result(true, stack.name + ' ikiye bölündü: ' + other.name + ' kuruldu.');
  }

  function mergeStacks(game, sid) {
    const stack = stackById(game, sid);
    if (!stack || stack.owner !== game.state.playerId) return game._result(false, 'Ordu bulunamadı.');
    const others = stacksOf(game, stack.owner).filter((s) => s !== stack && s.prov === stack.prov);
    if (!others.length) return game._result(false, 'Aynı eyalette birleşecek başka ordu yok.');
    for (const o of others) {
      stack.size = round1(stack.size + o.size);
      removeStack(game, o);
    }
    return game._result(true, others.length + ' ordu ' + stack.name + ' altında birleşti.');
  }

  // ------------------------------------------------------------------ günlük işleyiş
  function daily(game) {
    const st = game.state;
    if (!st.playerId || st.gameOver) return;
    st.stacks = st.stacks || [];
    st.sieges = st.sieges || {};
    ensureStacks(game);
    relocateStranded(game);
    for (const stack of [...st.stacks]) {
      if (stack.shattered > 0) stack.shattered--;
      if (stack.auto && !stack.shattered && --stack.think <= 0) {
        stack.think = THINK_EVERY;
        autoCommand(game, stack);
      }
      advance(game, stack);
    }
    resolveBattles(game);
    progressSieges(game);
  }

  /** Barıştan sonra düşman ya da tarafsız topraklarda kalan oyuncu orduları sınırın gerisine çekilir */
  function relocateStranded(game) {
    for (const stack of game.state.stacks) {
      const o = game.state.owner[stack.prov];
      if (o === stack.owner || game.isAllied(stack.owner, o) || hostile(game, stack.owner, o)) {
        stack.returning = false;
        continue;
      }
      if (stack.returning) continue;
      stack.returning = true;
      const { dist, prev } = distancesFrom(game, stack.prov, stack.owner, true);
      let best = -1;
      game.state.owner.forEach((ow, i) => {
        if (ow === stack.owner && (best < 0 || dist[i] < dist[best])) best = i;
      });
      if (best >= 0) {
        stack.path = buildPath(prev, stack.prov, best) || [];
        stack.progress = 0;
      }
    }
  }

  /** Yeni rota; ilk adım aynıysa yoldaki ilerleme korunur (yoksa hareketli hedefi kovalayan ordu hiç varamaz) */
  function setPath(stack, path) {
    if (stack.path[0] !== path[0]) stack.progress = 0;
    stack.path = path;
  }

  function advance(game, stack) {
    if (!stack.path.length) return;
    const next = stack.path[0];
    if (!canEnter(game, stack.owner, next, stack.returning)) {
      stack.path = [];
      return;
    }
    stack.progress++;
    if (stack.progress < stepDays(game, stack.owner, stack.prov, next)) return;
    stack.progress = 0;
    stack.prov = next;
    stack.path.shift();
    if (!stack.path.length && stack.returning && game.state.owner[stack.prov] === stack.owner) stack.returning = false;
  }

  /** Yapay zekâ orduları ve otomatik komutadaki oyuncu orduları için karar */
  function autoCommand(game, stack) {
    const st = game.state;
    const owner = stack.owner;
    const enemies = theaterEnemies(game, owner);
    if (!enemies.length || stack.returning) return;
    const enemySet = new Set(enemies);
    const { dist, prev } = distancesFrom(game, stack.prov, owner);
    const go = (target) => {
      if (target === stack.prov) {
        stack.path = [];
        return;
      }
      const path = buildPath(prev, stack.prov, target);
      if (path && (stack.path.length === 0 || stack.path[stack.path.length - 1] !== target)) setPath(stack, path);
    };
    const mine = strength(game, stack);
    const foes = st.stacks.filter((s) => enemySet.has(s.owner) && !s.shattered && isFinite(dist[s.prov]));
    // Duruş: oyuncu için en büyük düşmana karşı seçilen duruş; yapay zekâ için oyuncuya karşı duruşu
    const mainEnemy = enemies.reduce((a, b) => (game.nation(b).army > game.nation(a).army ? b : a));
    const war = game.warBetween(owner, mainEnemy);
    const stance = war ? game.stanceOf(war, owner) : 'balanced';

    // 1) Yakındaki çok güçlü düşmandan kaç
    const danger = foes.find((f) => dist[f.prov] <= 2 * ENEMY_STEP_DAYS && strength(game, f) > mine * 1.6);
    if (danger && stance !== 'offensive') {
      const home = homeProvince(game, owner);
      if (home >= 0 && home !== stack.prov) {
        const path = buildPath(prev, stack.prov, home);
        if (path) setPath(stack, path);
      }
      return;
    }
    // 2) Yenebileceği yakın bir düşman ordusuna saldır (kendi topraklarındakiler öncelikli)
    let target = null;
    let bestScore = -Infinity;
    const reach = stance === 'defensive' ? 3 * STEP_DAYS : 8 * ENEMY_STEP_DAYS;
    for (const f of foes) {
      if (dist[f.prov] > reach) continue;
      const ratio = mine / Math.max(0.1, strength(game, f));
      if (ratio < (stance === 'offensive' ? 0.95 : 1.15)) continue;
      const score = ratio * 10 - dist[f.prov] + (st.owner[f.prov] === owner ? 25 : 0);
      if (score > bestScore) { bestScore = score; target = f.prov; }
    }
    if (target !== null) return go(target);
    // 3) Kuşatma: taarruz/dengeli duruşta en yakın düşman eyaleti
    if (stance !== 'defensive') {
      const strongestFoe = foes.reduce((m, f) => Math.max(m, strength(game, f)), 0);
      if (stance === 'offensive' || mine >= strongestFoe * 0.8) {
        let best = -1;
        let bestCost = Infinity;
        st.owner.forEach((o, i) => {
          if (!enemySet.has(o) || !isFinite(dist[i])) return;
          // Başka bir ordumuzun hedeflediği eyalet yerine yenisini seç; başkentler cazip hedeflerdir
          const taken = st.stacks.some((s) => s !== stack && s.owner === owner && (s.prov === i || s.path[s.path.length - 1] === i));
          const cost = dist[i] + (taken ? 30 : 0) - (game.nation(o).capital === i ? 6 : 0);
          if (cost < bestCost) { bestCost = cost; best = i; }
        });
        if (best >= 0) return go(best);
      }
    }
    // 4) Savunma: kuşatılan kendi eyaletine ya da düşmana en yakın sınıra git
    const besieged = Object.keys(st.sieges).map(Number).filter((p) => st.owner[p] === owner && isFinite(dist[p]));
    if (besieged.length) return go(besieged.reduce((a, b) => (dist[b] < dist[a] ? b : a)));
    const front = frontierToward(game, owner, mainEnemy);
    if (front !== null && isFinite(dist[front])) go(front);
  }

  function resolveBattles(game) {
    const st = game.state;
    const byProv = new Map();
    for (const s of st.stacks) {
      if (s.shattered) continue;
      if (!byProv.has(s.prov)) byProv.set(s.prov, []);
      byProv.get(s.prov).push(s);
    }
    const pid = st.playerId;
    for (const [prov, here] of byProv) {
      const ours = here.filter((s) => s.owner === pid);
      const theirs = here.filter((s) => s.owner !== pid && hostile(game, s.owner, pid));
      if (!ours.length || !theirs.length) continue;
      battle(game, prov, ours, theirs);
    }
  }

  function battle(game, prov, ours, theirs) {
    const st = game.state;
    const pid = st.playerId;
    const provOwner = st.owner[prov];
    const fort = game.hasBuilding(prov, 'fort') ? 1.15 : 1;
    const terrain = (side) => (side.some((s) => s.owner === provOwner) ? 1.25 * fort : 1);
    const sP = ours.reduce((a, s) => a + strength(game, s), 0) * terrain(ours);
    const sE = theirs.reduce((a, s) => a + strength(game, s), 0) * terrain(theirs);
    const pWin = (sP ** 1.5 + 0.1) / (sP ** 1.5 + sE ** 1.5 + 0.2);
    const playerWon = game.random() < pWin;
    const [winners, losers, sW, sL] = playerWon ? [ours, theirs, sP, sE] : [theirs, ours, sE, sP];
    const lossShare = sL / Math.max(1, sW + sL);
    let lossW = 0;
    let lossL = 0;
    for (const s of losers) {
      const l = round1(Math.min(s.size, s.size * (0.25 + game.random() * 0.15) + 0.5));
      s.size = round1(s.size - l);
      game.nation(s.owner).army = round1(game.nation(s.owner).army - l);
      lossL += l;
    }
    for (const s of winners) {
      const l = round1(Math.min(s.size, s.size * (0.06 + game.random() * 0.08) * lossShare * 2));
      s.size = round1(s.size - l);
      game.nation(s.owner).army = round1(game.nation(s.owner).army - l);
      lossW += l;
    }
    const mainLoser = losers.reduce((a, b) => (b.size > a.size ? b : a)).owner;
    const mainWinner = winners.reduce((a, b) => (b.size > a.size ? b : a)).owner;
    const war = game.warBetween(mainWinner, mainLoser);
    if (war) war.battles[mainWinner] = (war.battles[mainWinner] || 0) + 2;
    game.nation(mainLoser).warExhaustion = Math.min(100, game.nation(mainLoser).warExhaustion + 2);
    // Yenilen ordular dağılır ya da geri çekilir
    for (const s of losers) {
      if (s.size < 0.5) {
        removeStack(game, s);
        continue;
      }
      s.shattered = SHATTER_DAYS;
      retreat(game, s);
    }
    for (const s of winners) if (s.size < 0.5) removeStack(game, s);
    // Kuşatmayı yalnızca kuşatanın yenilgisi bozar
    if (st.sieges[prov] && losers.some((s) => s.owner === st.sieges[prov].by)) delete st.sieges[prov];
    game.emit('battle', { war, winner: mainWinner, loser: mainLoser, lossW: round1(lossW), lossL: round1(lossL), province: prov, field: true });
    if (playerWon || losers.some((s) => s.owner === pid)) {
      game.addLog(
        (playerWon ? '🏆 Meydan muharebesi kazanıldı: ' : '💥 Meydan muharebesi kaybedildi: ') +
          game.nation(playerWon ? mainLoser : mainWinner).name + ' (kayıplar ' + Math.round((playerWon ? lossW : lossL) * 1000).toLocaleString('tr-TR') + ')',
        playerWon ? 'good' : 'bad',
        [pid],
      );
    }
  }

  function retreat(game, stack) {
    const { dist, prev } = distancesFrom(game, stack.prov, stack.owner);
    const enemyAt = new Set(game.state.stacks.filter((s) => hostile(game, s.owner, stack.owner)).map((s) => s.prov));
    let best = -1;
    game.state.owner.forEach((o, i) => {
      if (o !== stack.owner || enemyAt.has(i) || !isFinite(dist[i]) || i === stack.prov) return;
      if (best < 0 || dist[i] < dist[best]) best = i;
    });
    if (best < 0) {
      // Kaçacak yer yok: ordu teslim olur
      game.nation(stack.owner).army = round1(game.nation(stack.owner).army - stack.size);
      removeStack(game, stack);
      return;
    }
    stack.path = buildPath(prev, stack.prov, best) || [];
    stack.progress = 0;
  }

  function siegeNeeded(game, prov) {
    const owner = game.state.owner[prov];
    const nat = game.nation(owner);
    let days = 12 + game.state.dev[prov] * 0.8;
    if (nat.capital === prov) days += 25;
    if (game.provincesOf(owner).length === 1) days += 20;
    if (game.hasBuilding(prov, 'fort')) days += 25;
    return Math.round(days);
  }

  function progressSieges(game) {
    const st = game.state;
    const active = new Map();
    for (const s of st.stacks) {
      if (s.shattered || s.path.length) continue;
      const o = st.owner[s.prov];
      if (!hostile(game, s.owner, o)) continue;
      const enemyHere = st.stacks.some((x) => x.prov === s.prov && x.owner === o && !x.shattered);
      if (enemyHere) continue;
      // Büyük ordu daha hızlı kuşatır, ama surlar bir sınırın altına indirilemez
      const rate = Math.max(0.25, Math.min(1.2, s.size / (8 + st.dev[s.prov] * 0.8)));
      const cur = active.get(s.prov) || { by: s.owner, rate: 0 };
      cur.rate += rate;
      active.set(s.prov, cur);
    }
    for (const prov of Object.keys(st.sieges)) if (!active.has(Number(prov))) delete st.sieges[prov];
    for (const [prov, { by, rate }] of active) {
      const isNew = !(st.sieges[prov] && st.sieges[prov].by === by);
      const sg = isNew ? { by, progress: 0 } : st.sieges[prov];
      if (isNew && st.owner[prov] === st.playerId) {
        game.addLog('🏰 ' + game.nation(by).name + ' ' + placeName(game, prov) + ' kuşatmasını başlattı!', 'bad', [st.playerId]);
        game.emit('siege', { province: prov, by });
      }
      sg.progress = round1(sg.progress + rate);
      sg.needed = siegeNeeded(game, prov);
      st.sieges[prov] = sg;
      if (sg.progress >= sg.needed) {
        const loser = st.owner[prov];
        delete st.sieges[prov];
        const war = game.warBetween(by, loser);
        game.transferProvince(prov, by, war);
        if (war) war.battles[by] = (war.battles[by] || 0) + 1;
      }
    }
  }

  function cleanup(game, id) {
    game.state.stacks = (game.state.stacks || []).filter((s) => s.owner !== id);
  }

  /** Ordunun durumu (arayüz için) */
  function status(game, stack) {
    const st = game.state;
    if (stack.returning) return { kind: 'return', text: 'Sınırın gerisine çekiliyor' };
    if (stack.shattered) return { kind: 'shattered', text: 'Dağınık (' + stack.shattered + ' gün)' };
    const sg = st.sieges[stack.prov];
    if (sg && sg.by === stack.owner && !stack.path.length) {
      return { kind: 'siege', text: 'Kuşatma: ' + placeName(game, stack.prov) + ' %' + Math.min(99, Math.round((sg.progress / sg.needed) * 100)) };
    }
    if (stack.path.length) return { kind: 'move', text: 'Yürüyüşte (' + stack.path.length + ' eyalet)' };
    return { kind: 'idle', text: 'Beklemede' };
  }

  MH.armies = {
    init, daily, ensureStacks, sync, theaterShare, stacksOf, stackById, moveStack, setAuto, splitStack, mergeStacks,
    status, cleanup, distancesFrom, siegeNeeded, strength,
  };
})((globalThis.MH = globalThis.MH || {}));

  <script>
/*
 * Map Historia — yapay zekâ (dil modeli) bağlantısı.
 *
 * Desteklenen sağlayıcılar:
 *   - gemini : Google Gemini API (generativelanguage.googleapis.com), API anahtarı Google AI Studio'dan alınır
 *   - openai : OpenAI uyumlu /chat/completions uç noktası (OpenAI, OpenRouter, yerel sunucular…)
 *   - off    : yapay zekâ kapalı; sohbet ve eylemler kural tabanlı yedek modda çalışır
 *
 * API anahtarı yalnızca oyuncunun tarayıcısında (localStorage) saklanır ve doğrudan sağlayıcıya gönderilir.
 */
(function (MH) {
  'use strict';

  const KEY = 'mapHistoria.llm.v1';
  const GEMINI = 'https://generativelanguage.googleapis.com/v1beta';
  const DEFAULTS = { provider: 'gemini', apiKey: '', model: 'gemini-2.5-flash', baseUrl: 'https://api.openai.com/v1' };
  const GEMINI_MODELS = ['gemini-2.5-flash', 'gemini-2.5-flash-lite', 'gemini-2.5-pro'];
  const TIMEOUT_MS = 60000;

  let memory = null; // localStorage kullanılamıyorsa oturum boyunca bellekte tut

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) return { ...DEFAULTS, ...JSON.parse(raw) };
    } catch {
      /* depolama kapalı */
    }
    return { ...DEFAULTS, ...(memory || {}) };
  }

  function save(settings) {
    const clean = { ...DEFAULTS, ...settings, apiKey: String(settings.apiKey || '').trim(), model: String(settings.model || '').trim() || DEFAULTS.model };
    memory = clean;
    try {
      localStorage.setItem(KEY, JSON.stringify(clean));
      return true;
    } catch {
      return false;
    }
  }

  function enabled(settings = load()) {
    return settings.provider !== 'off' && !!settings.apiKey;
  }

  function withTimeout(promiseFn) {
    const ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    const timer = setTimeout(() => ctrl?.abort(), TIMEOUT_MS);
    return promiseFn(ctrl?.signal).finally(() => clearTimeout(timer));
  }

  async function readError(res) {
    let msg = 'HTTP ' + res.status;
    try {
      const body = await res.json();
      msg = body?.error?.message || body?.message || msg;
    } catch {
      /* gövde JSON değil */
    }
    if (res.status === 400 && /API key/i.test(msg)) return 'API anahtarı geçersiz.';
    if (res.status === 401 || res.status === 403) return 'API anahtarı reddedildi (' + msg + ').';
    if (res.status === 404) return 'Model bulunamadı: ayarlardan başka bir model seçin (' + msg + ').';
    if (res.status === 429) return 'Kota ya da hız sınırı aşıldı; biraz bekleyip yeniden deneyin.';
    return msg;
  }

  /**
   * Tek seferlik tamamlama.
   * messages: [{ role: 'user' | 'assistant', text }]
   * Dönüş: modelin metin yanıtı
   */
  async function complete({ system, messages, json = true, temperature = 0.8, maxTokens = 900 }, settings = load()) {
    if (!enabled(settings)) throw new Error('Yapay zekâ bağlantısı kurulmamış.');
    if (settings.provider === 'gemini') {
      const generationConfig = { temperature, maxOutputTokens: maxTokens };
      if (json) generationConfig.responseMimeType = 'application/json';
      // 2.5 Flash modellerinde "düşünme" kapatılır: oyun için hız daha önemli
      if (/2\.5-flash/.test(settings.model)) generationConfig.thinkingConfig = { thinkingBudget: 0 };
      const body = {
        systemInstruction: { parts: [{ text: system }] },
        contents: messages.map((m) => ({ role: m.role === 'assistant' ? 'model' : 'user', parts: [{ text: m.text }] })),
        generationConfig,
      };
      const res = await withTimeout((signal) => fetch(GEMINI + '/models/' + encodeURIComponent(settings.model) + ':generateContent', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': settings.apiKey },
        body: JSON.stringify(body),
        signal,
      }));
      if (!res.ok) throw new Error(await readError(res));
      const data = await res.json();
      const cand = data.candidates?.[0];
      const text = cand?.content?.parts?.map((p) => p.text || '').join('') || '';
      if (!text) {
        const reason = data.promptFeedback?.blockReason || cand?.finishReason || 'boş yanıt';
        throw new Error('Model yanıt vermedi (' + reason + ').');
      }
      return text;
    }
    // OpenAI uyumlu
    const base = String(settings.baseUrl || DEFAULTS.baseUrl).replace(/\/+$/, '');
    const send = (useJson) => withTimeout((signal) => fetch(base + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + settings.apiKey },
      body: JSON.stringify({
        model: settings.model,
        temperature,
        max_tokens: maxTokens,
        messages: [{ role: 'system', content: system }, ...messages.map((m) => ({ role: m.role, content: m.text }))],
        ...(useJson ? { response_format: { type: 'json_object' } } : {}),
      }),
      signal,
    }));
    let res = await send(json);
    if (!res.ok && json && res.status === 400) res = await send(false); // response_format desteklenmiyorsa
    if (!res.ok) throw new Error(await readError(res));
    const data = await res.json();
    const text = data.choices?.[0]?.message?.content || '';
    if (!text) throw new Error('Model boş yanıt verdi.');
    return text;
  }

  /** Metindeki ilk JSON nesnesini ayrıştırır (```json çitlerini ve açıklamaları tolere eder) */
  function parseJSON(text) {
    const t = String(text).replace(/```(?:json)?/gi, '').trim();
    try {
      return JSON.parse(t);
    } catch {
      const a = t.indexOf('{');
      const b = t.lastIndexOf('}');
      if (a >= 0 && b > a) return JSON.parse(t.slice(a, b + 1));
      throw new Error('Yapay zekâ yanıtı okunamadı.');
    }
  }

  async function completeJSON(req, settings) {
    return parseJSON(await complete({ ...req, json: true }, settings));
  }

  /** Bağlantıyı dener; Gemini'de kullanılabilir modelleri listeler */
  async function test(settings = load()) {
    if (!enabled(settings)) throw new Error('Önce bir API anahtarı girin.');
    let models = [];
    if (settings.provider === 'gemini') {
      const res = await withTimeout((signal) => fetch(GEMINI + '/models?pageSize=200', { headers: { 'x-goog-api-key': settings.apiKey }, signal }));
      if (!res.ok) throw new Error(await readError(res));
      const data = await res.json();
      models = (data.models || [])
        .filter((m) => (m.supportedGenerationMethods || []).includes('generateContent'))
        .map((m) => m.name.replace(/^models\//, ''))
        .filter((m) => /^gemini/.test(m));
    }
    const reply = await completeJSON({
      system: 'Sadece JSON yanıt ver.',
      messages: [{ role: 'user', text: 'Bağlantı testi. {"ok": true, "mesaj": "<Türkçe kısa selam>"} biçiminde yanıt ver.' }],
      temperature: 0,
      maxTokens: 60,
    }, settings);
    return { ok: true, message: reply.mesaj || 'Bağlantı çalışıyor.', models };
  }

  MH.llm = { load, save, enabled, complete, completeJSON, parseJSON, test, DEFAULTS, GEMINI_MODELS };
})((globalThis.MH = globalThis.MH || {}));

</script>
  <script>
/*
 * Map Historia — diplomatik sohbetler.
 *
 * Oyuncu herhangi bir ülkenin lideriyle serbest metinle yazışır. Yapay zekâ açıksa lider, ülkenin
 * durumu, ilişkiler ve oyun kuralları bağlamında karakterine uygun yanıt verir; kapalıysa anahtar
 * kelimelere dayalı kural tabanlı bir yedek yanıt üretilir.
 *
 * Anlaşmaların tek yetkilisi oyun kurallarıdır: model bir anlaşmayı "kabul" etse bile motor
 * (allianceCheck, tradeCheck, peaceCheck…) izin vermiyorsa uygulanmaz.
 */
(function (MH) {
  'use strict';

  const MAX_THREAD = 60;
  const MONTHLY_GAIN_CAP = 20; // sohbetle bir ayda kazanılabilecek en fazla ilişki
  const GENERIC_LEADER = /^(Hükümdar|Hükümet)$/;

  // ---------------------------------------------------------------- ad çözümleme (eylemlerle ortak)
  const norm = (s) => String(s || '').toLocaleLowerCase('tr').normalize('NFC');
  const SUFFIX = /('?(nin|nın|nun|nün|in|ın|un|ün|na|ne|ya|ye|a|e|da|de|ta|te|dan|den|tan|ten|la|le|ile|yla|yle|ı|i|u|ü|yı|yi|yu|yü))$/;

  /** Metinde geçen ülkeyi bulur (Türkçe ekleri tolere eder) */
  function findNation(game, text, exclude = []) {
    const t = ' ' + norm(text).replace(/[^\p{L}\p{N}' -]/gu, ' ') + ' ';
    let best = null;
    let bestLen = 0;
    for (const n of game.aliveNations()) {
      if (exclude.includes(n.id)) continue;
      const names = [n.name, n.name.split(' ')[0], n.id];
      for (const raw of names) {
        const name = norm(raw);
        if (name.length < 3) continue;
        const re = new RegExp('[\\s]' + name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + "('?[\\p{L}]*)?[\\s]", 'u');
        if (re.test(t) && name.length > bestLen) { best = n.id; bestLen = name.length; }
      }
    }
    return best;
  }

  /** Metinde geçen eyaleti (şehir adı) bulur; filtre: (pid) => bool */
  function findProvince(game, text, filter) {
    const t = norm(text);
    let best = -1;
    let bestLen = 0;
    game.grid.provinces.forEach((p) => {
      if (filter && !filter(p.id)) return;
      const name = norm(MH.places.nameOf(game, p.id)).replace(/ yöresi$| taşrası$/, '');
      if (name.length < 3) return;
      if (t.includes(name) && name.length > bestLen) { best = p.id; bestLen = name.length; }
    });
    return best;
  }

  /** Sohbette gösterilecek lider adı (adı bilinmeyen liderler için "X hükümeti") */
  function leaderName(nat) {
    if (!GENERIC_LEADER.test(nat.leader)) return nat.leader;
    return nat.name + (nat.leader === 'Hükümet' ? ' hükümeti' : ' hükümdarı');
  }

  // ---------------------------------------------------------------- konuşma kayıtları
  function threads(game) {
    game.state.chats = game.state.chats || {};
    return game.state.chats;
  }

  function thread(game, id) {
    const all = threads(game);
    return (all[id] = all[id] || []);
  }

  function post(game, id, from, text, extra = {}) {
    const list = thread(game, id);
    list.push({ from, text, day: game.state.day, ...extra });
    if (list.length > MAX_THREAD) list.splice(0, list.length - MAX_THREAD);
    if (from === 'nation') {
      game.state.chatUnread = game.state.chatUnread || {};
      game.state.chatUnread[id] = true;
    }
    game.emit('chat', { id, from });
  }

  /** Son mesaj tarihine göre sohbet listesi */
  function threadList(game) {
    return Object.entries(threads(game))
      .filter(([id, list]) => list.length && game.nation(id))
      .map(([id, list]) => ({ id, last: list[list.length - 1], unread: !!game.state.chatUnread?.[id] }))
      .sort((a, b) => b.last.day - a.last.day);
  }

  function markRead(game, id) {
    if (game.state.chatUnread) delete game.state.chatUnread[id];
  }

  // ---------------------------------------------------------------- kurallar: neye izin var?
  /** Karşı tarafın (them) oyuncuya (me) şu an kurallara göre verebileceği kararlar */
  function options(game, me, them) {
    const war = game.warBetween(me, them);
    const nat = game.nation(them);
    const opinion = game.opinion(them, me);
    const joinTargets = game.enemiesOf(me)
      .filter((x) => x !== them && !game.warBetween(them, x) && !game.isAllied(them, x))
      .map((x) => ({ id: x, name: game.nation(x).name, ok: opinion >= 40 || game.isAllied(them, me) }));
    return {
      alliance: war ? 'Savaştasınız.' : game.allianceCheck(me, them),
      trade: game.tradeCheck(me, them),
      peace_white: war ? game.peaceCheck(me, them, 'white') : 'Savaşta değilsiniz.',
      peace_player_pays: war ? game.peaceCheck(me, them, 'offer') : 'Savaşta değilsiniz.',
      peace_we_pay: war ? game.peaceCheck(me, them, 'demand') : 'Savaşta değilsiniz.',
      join_war: joinTargets,
      send_aid: opinion >= 50 && nat.gold > 60 ? null : 'İlişki en az 50 ve hazine yeterli olmalı.',
      declare_war: !war && !game.isAllied(me, them) && opinion <= -60 && game.militaryStrength(them) >= game.militaryStrength(me) * 0.8
        ? null : 'Savaş ilanı için ilişki −60 altında ve ordu yeterince güçlü olmalı.',
      break_alliance: game.isAllied(me, them) && opinion <= -30 ? null : 'Yalnızca müttefikken ve ilişki çok kötüyse.',
    };
  }

  /** Sohbetle ilişki değişimi (aylık kazanç tavanıyla) */
  function applyOpinion(game, me, them, delta) {
    const nat = game.nation(them);
    const d = Math.max(-10, Math.min(10, Math.round(delta || 0)));
    if (!d) return 0;
    let applied = d;
    if (d > 0) {
      const meta = nat.chatGain && game.state.day - nat.chatGain.day < 30 ? nat.chatGain : { day: game.state.day, sum: 0 };
      applied = Math.max(0, Math.min(d, MONTHLY_GAIN_CAP - meta.sum));
      meta.sum += applied;
      nat.chatGain = meta;
    }
    if (applied) game._changeOpinion(them, me, applied);
    return applied;
  }

  /** Karşı tarafın kabul ettiği anlaşmaları kurallardan geçirip uygular */
  function applyAgreements(game, me, them, agreements) {
    const results = [];
    const nat = game.nation(them);
    const opts = options(game, me, them);
    for (const a of (agreements || []).slice(0, 3)) {
      if (!a || a.accept === false) continue;
      const type = a.type;
      let res = null;
      if (type === 'alliance') res = opts.alliance ? fail(opts.alliance) : game.proposeAlliance(me, them);
      else if (type === 'trade') res = opts.trade ? fail(opts.trade) : game.proposeTrade(me, them);
      else if (type === 'peace_white') res = opts.peace_white ? fail(opts.peace_white) : game.offerPeace(me, them, 'white');
      else if (type === 'peace_player_pays') res = opts.peace_player_pays ? fail(opts.peace_player_pays) : game.offerPeace(me, them, 'offer');
      else if (type === 'peace_we_pay') res = opts.peace_we_pay ? fail(opts.peace_we_pay) : game.offerPeace(me, them, 'demand');
      else if (type === 'join_war') {
        const target = resolveTarget(game, a.target, opts.join_war);
        if (!target) res = fail('Katılınacak savaş bulunamadı.');
        else if (!target.ok) res = fail(nat.name + ' bu savaşa katılacak kadar yakın değil.');
        else {
          game._startWar(them, target.id, true);
          game._changeOpinion(target.id, them, -40);
          game.addLog(nat.name + ', ' + game.nation(me).name + ' yanında ' + target.name + ' ile savaşa girdi.', 'war', [me, them]);
          res = { ok: true, message: nat.name + ', ' + target.name + ' ile savaşa girdi!', effects: [[nat.name + ' yanınızda savaşıyor', null]] };
        }
      } else if (type === 'send_aid') {
        if (opts.send_aid) res = fail(opts.send_aid);
        else {
          const amount = Math.round(Math.max(10, Math.min(Number(a.amount) || 50, nat.gold * 0.2, 150)));
          nat.gold -= amount;
          game.nation(me).gold += amount;
          game.addLog(nat.name + ' ülkemize ' + amount + ' altın yardım gönderdi.', 'good', [me, them]);
          res = { ok: true, message: nat.name + ' ' + amount + ' altın yardım gönderdi.', effects: [['Altın', amount]] };
        }
      } else if (type === 'declare_war') {
        if (opts.declare_war) continue; // kurallar izin vermiyorsa sessizce yok sayılır
        res = game.declareWar(them, me);
        if (res.ok) game.queueEvent('war_declared', me, { target: them });
      } else if (type === 'break_alliance') {
        if (opts.break_alliance) continue;
        res = game.breakAlliance(them, me);
      } else continue;
      results.push({ type, ...res });
    }
    return results;
  }

  function fail(message) {
    return { ok: false, message, effects: [] };
  }

  function resolveTarget(game, raw, list) {
    if (!list.length) return null;
    if (!raw) return list[0];
    const id = findNation(game, ' ' + raw + ' ') || raw;
    return list.find((x) => x.id === id || norm(x.name) === norm(raw)) || null;
  }

  // ---------------------------------------------------------------- yapay zekâ ile
  function contextFor(game, me, them) {
    const P = game.nation(me);
    const T = game.nation(them);
    const war = game.warBetween(me, them);
    const name = (id) => game.nation(id)?.name;
    const brief = (n) => ({
      ulke: n.name,
      lider: n.leader,
      eyalet: game.provincesOf(n.id).length,
      ordu_bin_asker: Math.round(n.army),
      hazine: Math.round(n.gold),
      istikrar: Math.round(n.stability),
      muttefikler: n.allies.map(name).slice(0, 10),
      savastigi: game.enemiesOf(n.id).map(name),
      ticaret: n.trade.map(name).slice(0, 8),
    });
    const opts = options(game, me, them);
    const rule = (v) => (v ? 'HAYIR: ' + v : 'evet');
    const recent = game.state.log
      .filter((l) => l.nations?.includes(me) || l.nations?.includes(them))
      .slice(0, 6)
      .map((l) => MH.util.formatDay(l.day) + ': ' + l.text);
    return {
      tarih: MH.util.formatDay(game.state.day),
      senaryo: game.scenario.title,
      sen: brief(T),
      oyuncu: brief(P),
      iliski: {
        senin_ona_bakisin: game.opinion(them, me),
        onun_sana_bakisi: game.opinion(me, them),
        muttefik: game.isAllied(me, them),
        savasta: !!war,
        savas_skoru_senin_icin: war ? game.warScore(war, them) : null,
        ticaret: game.hasTrade(me, them),
        komsu: game.neighborsOf(me).includes(them),
        askeri_guc_orani_sen_bolu_oyuncu: +(game.militaryStrength(them) / Math.max(1, game.militaryStrength(me))).toFixed(2),
      },
      kurallara_gore_verebilecegin_kararlar: {
        alliance: rule(opts.alliance),
        trade: rule(opts.trade),
        peace_white: rule(opts.peace_white),
        peace_player_pays: rule(opts.peace_player_pays),
        peace_we_pay: rule(opts.peace_we_pay),
        join_war: opts.join_war.length ? opts.join_war.map((x) => x.name + ': ' + (x.ok ? 'evet' : 'HAYIR (ilişki yetersiz)')) : 'oyuncunun savaşı yok',
        send_aid: rule(opts.send_aid),
        declare_war: rule(opts.declare_war),
        break_alliance: rule(opts.break_alliance),
      },
      son_olaylar: recent,
    };
  }

  function systemPrompt(game, them) {
    const T = game.nation(them);
    return [
      GENERIC_LEADER.test(T.leader)
        ? `Sen "Map Historia" adlı tarihî/alternatif tarih strateji oyununda ${T.name} ülkesinin yöneticisisin (dönemine uygun bir hükümdar ya da hükümet başkanı olarak konuş).`
        : `Sen "Map Historia" adlı tarihî/alternatif tarih strateji oyununda ${T.name} ülkesinin lideri ${T.leader} olarak konuşuyorsun.`,
      'Oyuncu başka bir ülkenin lideri olarak seninle yazışıyor. Ülkenin çıkarlarını, dönemin üslubunu ve karakterini koru.',
      'Kurallar:',
      '- Türkçe yaz. Yanıtın kısa olsun: en fazla 3-4 cümle. Gerektiğinde pazarlık et, karşı teklif ver ya da reddet.',
      '- Gerçek kişileri canlandırırken saygılı ve oyun bağlamında kal; nefret söylemi, aşağılayıcı ifade ya da gerçek dünyaya yönelik şiddet çağrısı yapma.',
      '- Resmî kararları yalnızca "agreements" listesiyle ver. Bağlam içindeki "kurallara_gore_verebilecegin_kararlar" alanında HAYIR olanları kabul edemezsin.',
      '- Bir anlaşmayı yalnızca oyuncu bunu açıkça istediyse ya da sen önerdiysen ve uygunsa ekle. Emin değilsen ekleme.',
      '- "opinion_change": oyuncunun bu mesajı ilişkinizi nasıl etkiledi (-10 ile +10). Nazik ve ikna edici sözler artırır, tehdit ve hakaret düşürür.',
      'Yalnızca şu JSON biçiminde yanıt ver:',
      '{"reply":"lider olarak yanıtın","opinion_change":0,"mood":"dostça|nötr|soğuk|öfkeli","agreements":[{"type":"alliance|trade|peace_white|peace_player_pays|peace_we_pay|join_war|send_aid|declare_war|break_alliance","accept":true,"target":"(join_war için ülke adı)","amount":0}]}',
      'Anlamlar: peace_player_pays = oyuncu sana tazminat öder ve barış olur; peace_we_pay = sen oyuncuya tazminat ödersin ve barış olur; join_war = oyuncunun yanında bir düşmanına karşı savaşa girersin; send_aid = oyuncuya altın yardımı gönderirsin; declare_war = oyuncuya savaş açarsın (yalnızca çok öfkeliysen ve kural izin veriyorsa).',
    ].join('\n');
  }

  async function replyWithLLM(game, me, them, text) {
    const history = thread(game, them).slice(-12, -1).map((m) => ({
      role: m.from === 'player' ? 'user' : 'assistant',
      text: m.from === 'system' ? '[Oyun bilgisi] ' + m.text : m.text,
    }));
    // Model geçmişi user ile başlamalı
    while (history.length && history[0].role !== 'user') history.shift();
    const ctx = contextFor(game, me, them);
    const messages = [
      ...history,
      { role: 'user', text: 'DURUM (JSON):\n' + JSON.stringify(ctx) + '\n\nOYUNCUNUN MESAJI:\n' + text },
    ];
    const out = await MH.llm.completeJSON({ system: systemPrompt(game, them), messages, temperature: 0.85, maxTokens: 700 });
    return {
      reply: String(out.reply || '').slice(0, 900) || '…',
      opinion: Number(out.opinion_change) || 0,
      mood: out.mood,
      agreements: Array.isArray(out.agreements) ? out.agreements : [],
    };
  }

  // ---------------------------------------------------------------- yapay zekâ olmadan (yedek)
  const KW = {
    alliance: /ittifak|müttefik|birlik kur|savunma pakt/,
    trade: /ticaret|ticari|serbest ticaret|gümrük/,
    peace_player_pays: /(tazminat|haraç|altın)[^.]*(öde(r|yeyim|yeceğiz|riz)|vere(yim|ceğiz|rim)|teklif)/,
    peace_we_pay: /(tazminat|haraç)[^.]*(isti|öde(yin|men|sin)|ver(in|men|sin))/,
    peace_white: /barış|ateşkes|savaşı bitir/,
    join_war: /(savaşa katıl|yanımızda savaş|birlikte savaş|karşı (savaş|ittifak)|bize katıl)/,
    send_aid: /(yardım|destek|kredi|altın|para)[^.]*(gönder|ver|lazım|ihtiyaç)/,
  };
  const FRIENDLY = /(selam|merhaba|dost|kardeş|saygı|teşekkür|işbirliği|barış içinde|iyi niyet|komşu)/;
  const THREAT = /(tehdit|işgal|yok ede|ezece|pişman|savaş ilan ede|haddini|boyun eğ)/;
  const INSULT = /(aptal|korkak|hain|zavallı|beceriksiz|ahmak)/;

  function replyOffline(game, me, them, text) {
    const t = norm(text);
    const agreements = [];
    let opinion = 0;
    if (FRIENDLY.test(t)) opinion += 3;
    if (THREAT.test(t)) opinion -= 8;
    if (INSULT.test(t)) opinion -= 10;
    const opts = options(game, me, them);
    const asked = [];
    if (KW.alliance.test(t)) asked.push('alliance');
    if (KW.trade.test(t)) asked.push('trade');
    if (game.warBetween(me, them)) {
      if (KW.peace_player_pays.test(t)) asked.push('peace_player_pays');
      else if (KW.peace_we_pay.test(t)) asked.push('peace_we_pay');
      else if (KW.peace_white.test(t)) asked.push('peace_white');
    }
    if (KW.join_war.test(t)) asked.push('join_war');
    if (KW.send_aid.test(t)) asked.push('send_aid');
    for (const type of asked) {
      if (type === 'join_war' && !opts.join_war.length && game.enemiesOf(me).some((x) => game.warBetween(them, x))) {
        agreements.push({ type: 'already_fighting', accept: true });
        continue;
      }
      const ok = type === 'join_war' ? opts.join_war.some((x) => x.ok) : !opts[type];
      agreements.push({ type, accept: ok, target: type === 'join_war' ? findNation(game, text, [me, them]) : undefined });
    }
    if (THREAT.test(t) && !opts.declare_war) agreements.push({ type: 'declare_war', accept: true });
    const op = game.opinion(them, me) + opinion;
    const T = game.nation(them);
    const tone = op >= 50 ? 'dost' : op >= 0 ? 'nötr' : op >= -40 ? 'soğuk' : 'öfkeli';
    const open = {
      dost: ['Sevgili dostum, mektubunuz bizi memnun etti.', 'Değerli müttefikimiz, sözleriniz yüreğimizi ısıttı.'],
      nötr: ['Mesajınızı aldık ve dikkatle değerlendirdik.', 'Elçinizi kabul ettik; sözlerinizi tarttık.'],
      soğuk: ['Sözleriniz sarayımızda pek hoş karşılanmadı.', 'Niyetinizden emin değiliz.'],
      öfkeli: ['Küstahlığınızı unutmadık.', 'Bu sözlerin bedelini düşünmeden mi yazdınız?'],
    }[tone];
    const parts = [game.pick(open)];
    const label = {
      alliance: ['İttifak teklifinizi kabul ediyoruz; bundan böyle omuz omuzayız.', 'Şimdilik bir ittifaka hazır değiliz.'],
      trade: ['Tüccarlarımız limanlarınıza açılmaya hazır; anlaşma tamamdır.', 'Ticaret için henüz güven oluşmadı.'],
      peace_white: ['Kan dökülmesi yeter; beyaz barışı kabul ediyoruz.', 'Savaş meydanı henüz son sözünü söylemedi; barış yok.'],
      peace_player_pays: ['Tazminat karşılığında barışa razıyız.', 'Teklif ettiğiniz bedel yetersiz.'],
      peace_we_pay: ['Yenilgimizi kabul ediyor, istediğiniz tazminatı ödüyoruz.', 'Size tek bir altın ödemeyeceğiz!'],
      join_war: ['Düşmanınız düşmanımızdır; ordularımız yola çıkıyor.', 'Bu savaşa girmek halkımızın çıkarına değil.'],
      send_aid: ['Hazinemizden size yardım gönderiyoruz.', 'Hazinemiz yardıma uygun değil.'],
      declare_war: ['Tehditlerinize ancak kılıçla cevap verilir. Savaş!', ''],
      already_fighting: ['Ordularımız zaten sizinle aynı safta savaşıyor.', ''],
    };
    for (const a of agreements) {
      const pair = label[a.type];
      if (pair) parts.push(a.accept ? pair[0] : pair[1]);
    }
    if (!agreements.length) {
      parts.push(tone === 'dost' ? 'İlişkilerimizin daha da gelişmesini dileriz.' : tone === 'öfkeli' ? 'Sınırlarımızı korumaya hazırız.' : 'Somut bir teklifiniz varsa dinlemeye hazırız.');
    }
    parts.push('— ' + leaderName(T));
    return { reply: parts.filter(Boolean).join(' '), opinion, mood: tone, agreements };
  }

  // ---------------------------------------------------------------- dış arayüz
  /** Oyuncunun mesajını gönderir; yanıtı ve uygulanan sonuçları döndürür */
  async function send(game, them, text, { useLLM = MH.llm?.enabled() } = {}) {
    const me = game.state.playerId;
    const clean = String(text || '').trim().slice(0, 1200);
    if (!clean) throw new Error('Boş mesaj gönderilemez.');
    if (!game.nation(them)?.alive) throw new Error('Bu ülke artık yok.');
    post(game, them, 'player', clean);
    let r;
    let usedLLM = false;
    if (useLLM) {
      try {
        r = await replyWithLLM(game, me, them, clean);
        usedLLM = true;
      } catch (err) {
        r = replyOffline(game, me, them, clean);
        r.warning = 'Yapay zekâ yanıt veremedi (' + err.message + '); kural tabanlı yanıt kullanıldı.';
      }
    } else r = replyOffline(game, me, them, clean);
    const applied = applyOpinion(game, me, them, r.opinion);
    const results = applyAgreements(game, me, them, r.agreements);
    const effects = [];
    if (applied) effects.push([game.nation(them).name + ' ilişkisi', applied]);
    for (const res of results) {
      effects.push([(res.ok ? '✓ ' : '✗ ') + res.message, null]);
      for (const e of res.effects || []) if (e[1] !== null && e[1] !== undefined) effects.push(e);
    }
    post(game, them, 'nation', r.reply, { fx: effects, mood: r.mood, ai: usedLLM });
    markRead(game, them);
    return { reply: r.reply, effects, results, usedLLM, warning: r.warning };
  }

  /** Yapay zekâ kaynaklı olayları ilgili ülkenin sohbetine de yazar */
  const EVENT_TEXT = {
    ai_alliance_offer: (n) => leaderName(n) + ': Ülkelerimiz arasında bir savunma ittifakı öneriyoruz. Cevabınızı bekliyoruz.',
    ai_peace_offer: (n, ctx) => leaderName(n) + ': Bu savaş iki halkımıza da acı veriyor. ' + (ctx.pay ? 'Tazminat ödemeye hazırız; barış yapalım.' : 'Barış masasına oturalım.'),
    ai_peace_demand: (n) => leaderName(n) + ': Ordularımız üstün geldi. Tazminat öderseniz savaş biter; aksi hâlde ilerlemeye devam edeceğiz.',
    war_declared: (n) => leaderName(n) + ': Sabrımız tükendi. Bugünden itibaren ülkelerimiz savaştadır!',
  };

  function attach(game) {
    game.on('event', ({ pending }) => {
      const make = EVENT_TEXT[pending?.eventId];
      const id = pending?.ctx?.target;
      if (!make || !id || !game.nation(id)) return;
      post(game, id, 'nation', make(game.nation(id), pending.ctx), { event: pending.eventId });
    });
  }

  /** Hızlı teklif düğmeleri için hazır metinler */
  function quickProposals(game, them) {
    const me = game.state.playerId;
    const war = game.warBetween(me, them);
    const list = [];
    if (war) {
      list.push(['🕊️ Beyaz barış', 'Bu savaş ikimize de zarar veriyor. Beyaz barış öneriyorum.']);
      list.push(['💰 Tazminat iste', 'Savaşı kaybettiğinizi kabul edin; tazminat ödeyin ve barış yapalım.']);
      list.push(['🤲 Tazminat öde', 'Barış karşılığında size tazminat ödemeye hazırız.']);
    } else {
      if (!game.isAllied(me, them)) list.push(['🤝 İttifak', 'Ülkelerimiz arasında bir savunma ittifakı öneriyorum.']);
      if (!game.hasTrade(me, them)) list.push(['📦 Ticaret', 'Karşılıklı yarar için bir ticaret anlaşması imzalayalım.']);
      const enemy = game.enemiesOf(me)[0];
      if (enemy) list.push(['⚔️ Savaşa katıl', game.nation(enemy).name + ' ile savaşımızda yanımızda yer almanızı istiyoruz.']);
      list.push(['💬 Selam', 'Halkımız adına size dostluk ve iyi niyet mesajı gönderiyorum.']);
    }
    return list;
  }

  MH.diplomacy = { leaderName, applyOpinion, send, thread, threadList, post, markRead, attach, options, quickProposals, contextFor, findNation, findProvince, replyOffline, applyAgreements, norm };
})((globalThis.MH = globalThis.MH || {}));

</script>
  <script>
/*
 * Map Historia — serbest metinle eylemler.
 *
 * Oyuncu ne yapmak istediğini kendi cümleleriyle yazar ("Fransa ile ittifak kur, vergileri %20'ye indir,
 * Viyana'ya saldır"). Yapay zekâ açıksa bir "oyun yöneticisi" modeli metni izin verilen işlemlere
 * (ops) çevirir ve kısa bir anlatı yazar; kapalıysa anahtar kelimelere dayalı bir ayrıştırıcı çalışır.
 *
 * Her işlem motorun kendi fonksiyonlarından geçer: kurallar izin vermiyorsa uygulanmaz ve gerekçesi
 * oyuncuya bildirilir. Modelin uydurduğu serbest "politika" etkileri sınırlandırılır ve bedeli
 * motor tarafından hesaplanır.
 */
(function (MH) {
  'use strict';

  const MAX_OPS = 8;
  const MAX_HISTORY = 30;
  const POLICY_COOLDOWN = 60; // iki özel politika arası en az gün

  const OPS = [
    'set_tax', 'set_focus', 'recruit', 'mercenaries', 'disband', 'build', 'festival',
    'propose_trade', 'cancel_trade', 'propose_alliance', 'break_alliance', 'gift',
    'declare_war', 'offer_peace', 'stance', 'attack', 'colonize', 'policy',
  ];

  const BUILD_WORDS = {
    market: /pazar|çarşı|liman|ticaret merkezi|borsa|fabrika|sanayi tesisi/,
    barracks: /kışla|askerî? ?üs|eğitim kampı/,
    fort: /kale|tahkimat|sur|istihkam|hava savunma/,
    temple: /mabet|cami|kilise|tapınak|katedral|manastır|külliye|okul|üniversite|hastane/,
  };
  const FOCUS_WORDS = { agriculture: /tarım/, industry: /sanayi|endüstri/, trade: /ticaret/, military: /asker|militar|savunma/ };

  // Özel politika fiyat listesi (birim başına altın) ve tavanları
  const POLICY = {
    stability: { price: 12, max: 6, min: -10, label: 'İstikrar' },
    capitalDev: { price: 60, max: 2, min: 0, label: 'Başkent gelişimi' },
    manpower: { price: 5, max: 10, min: -10, label: 'İnsan gücü', unit: 'k' },
    warExhaustion: { price: 5, max: 0, min: -10, label: 'Savaş yorgunluğu' },
    opinionAll: { price: 25, max: 4, min: -10, label: 'Tüm ülkelerle ilişki' },
  };

  const D = () => MH.diplomacy;
  const norm = (s) => D().norm(s);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const fmt = (n) => Math.round(n).toLocaleString('tr-TR');

  // ---------------------------------------------------------------- ad çözümleme
  function nationOf(game, raw) {
    if (!raw) return null;
    if (game.nation(raw)?.alive) return raw;
    const id = D().findNation(game, ' ' + raw + ' ');
    return id && game.nation(id)?.alive ? id : null;
  }

  function provinceOf(game, raw, filter) {
    if (raw === undefined || raw === null || raw === '') return -1;
    if (Number.isInteger(raw) && game.grid.provinces[raw]) return filter && !filter(raw) ? -1 : raw;
    return D().findProvince(game, String(raw), filter);
  }

  const fail = (message) => ({ ok: false, message, effects: [] });

  // ---------------------------------------------------------------- işlemleri uygula
  function execute(game, op) {
    const me = game.state.playerId;
    const nat = game.nation(me);
    const t = op?.type;
    const need = (key) => {
      const id = nationOf(game, op[key] ?? op.nation ?? op.target);
      return id && id !== me ? id : null;
    };
    switch (t) {
      case 'set_tax': {
        let v = Number(op.value);
        if (!Number.isFinite(v)) v = nat.tax + (Number(op.delta) || 0);
        return game.setTax(me, clamp(v, 0, 50));
      }
      case 'set_focus':
        return game.setFocus(me, op.focus);
      case 'recruit':
        return game.recruit(me, clamp(Math.round(Number(op.amount) || 5), 1, Math.max(1, Math.floor(nat.manpower))));
      case 'mercenaries':
        return game.hireMercenaries(me, clamp(Math.round(Number(op.amount) || 5), 1, 50));
      case 'disband':
        return game.disband(me, clamp(Math.round(Number(op.amount) || 5), 1, 500));
      case 'festival':
        return game.holdFestival(me);
      case 'build': {
        if (!MH.BUILDINGS[op.building]) return fail('Bilinmeyen yapı türü.');
        let pid = provinceOf(game, op.province, (p) => game.state.owner[p] === me);
        if (pid < 0) pid = bestBuildSpot(game, me, op.building);
        if (pid < 0) return fail('Uygun bir eyalet bulunamadı.');
        return game.build(me, pid, op.building);
      }
      case 'colonize': {
        const pid = provinceOf(game, op.province, (p) => game.state.owner[p] === null);
        if (pid < 0) {
          const near = nearestUnclaimed(game, me);
          if (near < 0) return fail('Kolonileştirilecek sahipsiz toprak bulunamadı.');
          return game.colonize(me, near);
        }
        return game.colonize(me, pid);
      }
      case 'propose_trade': { const id = need('nation'); return id ? game.proposeTrade(me, id) : fail('Ülke bulunamadı.'); }
      case 'cancel_trade': { const id = need('nation'); return id ? game.cancelTrade(me, id) : fail('Ülke bulunamadı.'); }
      case 'propose_alliance': { const id = need('nation'); return id ? game.proposeAlliance(me, id) : fail('Ülke bulunamadı.'); }
      case 'break_alliance': { const id = need('nation'); return id ? game.breakAlliance(me, id) : fail('Ülke bulunamadı.'); }
      case 'gift': {
        const id = need('nation');
        if (!id) return fail('Ülke bulunamadı.');
        const amount = Math.round(clamp(Number(op.amount) || 50, 10, Math.max(10, nat.gold)));
        return game.sendGift(me, id, amount);
      }
      case 'declare_war': {
        const id = need('nation');
        if (!id) return fail('Ülke bulunamadı.');
        const res = game.declareWar(me, id);
        if (res.ok && MH.armies) MH.armies.ensureStacks(game);
        return res;
      }
      case 'offer_peace': {
        const id = need('nation');
        if (!id) return fail('Ülke bulunamadı.');
        const type = { white: 'white', demand: 'demand', offer: 'offer' }[op.kind || op.peace] || 'white';
        return game.offerPeace(me, id, type);
      }
      case 'stance': {
        const id = need('nation');
        if (!id) return fail('Ülke bulunamadı.');
        return game.setWarStance(me, id, op.stance);
      }
      case 'attack':
        return attack(game, me, op);
      case 'policy':
        return policy(game, me, op);
      default:
        return fail('Bu eylem oyunda karşılık bulmuyor.');
    }
  }

  function bestBuildSpot(game, me, type) {
    let best = -1;
    let bestDev = -1;
    for (const pid of game.provincesOf(me)) {
      if (game.hasBuilding(pid, type) || game.underConstruction(pid).some((c) => c.type === type) || game.state.sieges?.[pid]) continue;
      const dev = game.state.dev[pid];
      if (dev > bestDev) { bestDev = dev; best = pid; }
    }
    return best;
  }

  function nearestUnclaimed(game, me) {
    const own = new Set(game.provincesOf(me));
    let best = -1;
    let bestD = Infinity;
    const cap = game.nation(me).capital;
    game.grid.provinces.forEach((p) => {
      if (game.state.owner[p.id] !== null || game.canColonize(me, p.id)) return;
      const adj = p.neighbors.some((n) => own.has(n));
      const d = (adj ? 0 : 1e6) + (cap >= 0 ? game.grid.distanceKm(cap, p.id) : 0);
      if (d < bestD) { bestD = d; best = p.id; }
    });
    return best;
  }

  /** Bir düşman eyaletine (ya da düşman ülkenin başkentine) en büyük orduyu yollar */
  function attack(game, me, op) {
    if (!MH.armies) return fail('Ordular bu oyunda kullanılamıyor.');
    const enemies = game.enemiesOf(me);
    if (!enemies.length) return fail('Savaşta olmadığınız için saldırı emri verilemez; önce savaş ilan edin.');
    MH.armies.ensureStacks(game);
    let target = provinceOf(game, op.province, (p) => enemies.includes(game.state.owner[p]));
    if (target < 0) {
      const id = nationOf(game, op.nation ?? op.target);
      const foe = id && enemies.includes(id) ? id : enemies[0];
      target = game.nation(foe).capital;
      if (target < 0 || game.state.owner[target] !== foe) target = game.provincesOf(foe)[0] ?? -1;
    }
    if (target < 0) return fail('Saldırılacak düşman toprağı bulunamadı.');
    const stacks = MH.armies.stacksOf(game, me).slice().sort((a, b) => b.size - a.size);
    if (!stacks.length) return fail('Sahada ordunuz yok; önce asker toplayın.');
    let last = null;
    for (const s of stacks) {
      last = MH.armies.moveStack(game, s.id, target);
      if (last.ok) return last;
    }
    return last;
  }

  /** Model tarafından önerilen özel politika: etkiler sınırlanır, bedel motorca hesaplanır */
  function policy(game, me, op) {
    const nat = game.nation(me);
    const st = game.state;
    if (st.lastPolicyDay !== undefined && st.day - st.lastPolicyDay < POLICY_COOLDOWN) {
      return fail('Yeni bir reform için ' + (POLICY_COOLDOWN - (st.day - st.lastPolicyDay)) + ' gün beklenmeli.');
    }
    const fx = {};
    let cost = 0;
    for (const [key, rule] of Object.entries(POLICY)) {
      let v = Math.round(Number(op.effects?.[key]) || 0);
      v = clamp(v, rule.min, rule.max);
      if (!v) continue;
      fx[key] = v;
      // Olumlu etkiler bedellidir (savaş yorgunluğunda azalma olumludur)
      const gain = key === 'warExhaustion' ? -v : v;
      if (gain > 0) cost += gain * rule.price;
    }
    if (!Object.keys(fx).length) return fail('Bu politikanın oyunda ölçülebilir bir etkisi yok.');
    cost = Math.round(Math.max(cost, Number(op.cost) || 0));
    if (cost > nat.gold) return fail((op.title || 'Politika') + ' için ' + fmt(cost) + ' altın gerekli.');
    nat.gold = Math.round((nat.gold - cost) * 10) / 10;
    st.lastPolicyDay = st.day;
    const effects = cost ? [['Altın', -cost]] : [];
    const engineFx = { stability: fx.stability, manpower: fx.manpower, warExhaustion: fx.warExhaustion, capitalDev: fx.capitalDev ? fx.capitalDev * 3 : 0, opinionAll: fx.opinionAll };
    if (engineFx.manpower > 0) engineFx.manpower = Math.min(engineFx.manpower, Math.max(0, game.maxManpower(me) - nat.manpower));
    effects.push(...game.applyEffects(me, engineFx));
    const title = String(op.title || 'Reform').slice(0, 80);
    game.addLog('📜 ' + title + ' yürürlüğe girdi.', 'player', [me]);
    return { ok: true, message: title + ' yürürlüğe girdi.', effects };
  }

  /** Model ya da yedek ayrıştırıcının ürettiği tepkiler (ilişki değişimi, sınırlı) */
  function applyReactions(game, me, reactions) {
    const out = [];
    for (const r of (reactions || []).slice(0, 4)) {
      const id = nationOf(game, r.nation);
      if (!id || id === me) continue;
      const delta = clamp(Math.round(Number(r.opinion) || 0), -15, 8);
      const applied = delta > 0 ? D().applyOpinion(game, me, id, delta) : delta;
      if (delta < 0) game._changeOpinion(id, me, delta);
      out.push({ nation: id, name: game.nation(id).name, opinion: applied, text: String(r.text || '').slice(0, 240) });
    }
    return out;
  }

  // ---------------------------------------------------------------- yapay zekâ: oyun yöneticisi
  function contextFor(game) {
    const me = game.state.playerId;
    const P = game.nation(me);
    const name = (id) => game.nation(id)?.name;
    const budget = game.budget(me);
    const own = game.provincesOf(me);
    const topProv = own.slice().sort((a, b) => game.state.dev[b] - game.state.dev[a]).slice(0, 12)
      .map((pid) => MH.places.nameOf(game, pid) + (game.state.buildings?.[pid]?.length ? ' [' + game.state.buildings[pid].join(',') + ']' : ''));
    const enemies = game.enemiesOf(me);
    const enemyProv = enemies.flatMap((e) => game._frontier(me, e).slice(0, 5).map((pid) => MH.places.nameOf(game, pid) + ' (' + name(e) + ')'));
    const unclaimed = [];
    game.grid.provinces.forEach((p) => {
      if (unclaimed.length < 6 && game.state.owner[p.id] === null && game.adjacentToOwn(me, p.id)) unclaimed.push(MH.places.nameOf(game, p.id));
    });
    const relations = game.aliveNations()
      .filter((n) => n.id !== me)
      .map((n) => ({ n, op: game.opinion(n.id, me), nb: game.neighborsOf(me).includes(n.id) }))
      .sort((a, b) => (b.nb - a.nb) || Math.abs(b.op) - Math.abs(a.op) || game.militaryStrength(b.n.id) - game.militaryStrength(a.n.id))
      .slice(0, 18)
      .map(({ n, op, nb }) => n.name + ': ilişki ' + op + (nb ? ', komşu' : '') + (game.isAllied(me, n.id) ? ', müttefik' : '') + (game.hasTrade(me, n.id) ? ', ticaret' : '') + (game.warBetween(me, n.id) ? ', SAVAŞTA' : ''));
    return {
      tarih: MH.util.formatDay(game.state.day),
      senaryo: game.scenario.title,
      ulke: P.name,
      lider: P.leader,
      hazine: Math.round(P.gold),
      aylik_gelir: Math.round(budget.total),
      vergi_orani: P.tax,
      uretim_odagi: P.focus,
      istikrar: Math.round(P.stability),
      ordu_bin: Math.round(P.army),
      insan_gucu_bin: Math.round(P.manpower),
      asker_maliyeti_bin_basina: game.recruitCost(me),
      senlik_maliyeti: game.festivalCost(me),
      savas_yorgunlugu: Math.round(P.warExhaustion),
      muttefikler: P.allies.map(name),
      savastigi: enemies.map(name),
      eyalet_sayisi: own.length,
      onemli_eyaletler: topProv,
      cephe_eyaletleri: enemyProv.slice(0, 12),
      yakin_sahipsiz_topraklar: unclaimed,
      iliskiler: relations,
    };
  }

  function systemPrompt() {
    return [
      'Sen "Map Historia" adlı tarihî/alternatif tarih strateji oyununun oyun yöneticisisin (game master).',
      'Oyuncu ülkesi için bu tur ne yapmak istediğini serbest metinle yazar. Görevin metni oyunun izin verdiği işlemlere çevirmek ve sonucu kısa, sürükleyici bir dille anlatmaktır.',
      'İzin verilen işlemler (ops):',
      '- {"type":"set_tax","value":0-50}',
      '- {"type":"set_focus","focus":"agriculture|industry|trade|military"}',
      '- {"type":"recruit","amount":bin_asker} (insan gücü ve altın harcar)',
      '- {"type":"mercenaries","amount":bin_asker} (3 kat pahalı)',
      '- {"type":"disband","amount":bin_asker}',
      '- {"type":"build","building":"market|barracks|fort|temple","province":"şehir adı ya da boş"}',
      '- {"type":"festival"}',
      '- {"type":"propose_trade|cancel_trade|propose_alliance|break_alliance|declare_war","nation":"ülke adı"}',
      '- {"type":"gift","nation":"ülke adı","amount":altın}',
      '- {"type":"offer_peace","nation":"ülke adı","kind":"white|demand|offer"} (demand: tazminat iste, offer: tazminat öde)',
      '- {"type":"stance","nation":"düşman ülke","stance":"offensive|balanced|defensive"}',
      '- {"type":"attack","province":"düşman şehir adı","nation":"düşman ülke"} (orduyu yollar; önce savaşta olmak gerekir)',
      '- {"type":"colonize","province":"sahipsiz toprak adı"}',
      '- {"type":"policy","title":"kısa ad","effects":{"stability":-10..6,"capitalDev":0..2,"manpower":-10..10,"warExhaustion":-10..0,"opinionAll":-10..4}} (yukarıdakilere uymayan reformlar, yasalar, propaganda vb. için; bedeli oyun hesaplar, 60 günde bir)',
      'Kurallar:',
      '- Türkçe yaz. Oyuncunun istemediği bir işlemi ekleme. En fazla 8 işlem.',
      '- Oyunda karşılığı olmayan ya da imkânsız/aşırı istekleri (ör. "tüm dünyayı fethet", "1 milyon altın kazan") "refused" listesinde kısa gerekçeyle belirt.',
      '- Anlatı ("narrative") 2-4 cümle olsun; işlemlerin sonucu oyunca belirlenir, bu yüzden kesin başarı vaadetme ("…emri verildi", "…teklif edildi" gibi yaz).',
      '- "reactions": bu eylemlerden en çok etkilenen en fazla 4 ülkenin tepkisi (opinion −15..+8, kısa bir cümle). Gerekmiyorsa boş bırak.',
      '- Gerçek kişileri canlandırırken saygılı ve oyun bağlamında kal.',
      'Yalnızca şu JSON biçiminde yanıt ver:',
      '{"headline":"gazete manşeti gibi kısa başlık","narrative":"…","ops":[…],"refused":[{"text":"…","reason":"…"}],"reactions":[{"nation":"ülke","opinion":0,"text":"…"}]}',
    ].join('\n');
  }

  async function planWithLLM(game, text) {
    const out = await MH.llm.completeJSON({
      system: systemPrompt(),
      messages: [{ role: 'user', text: 'DURUM (JSON):\n' + JSON.stringify(contextFor(game)) + '\n\nOYUNCUNUN EYLEMLERİ:\n' + text }],
      temperature: 0.7,
      maxTokens: 1200,
    });
    return {
      headline: String(out.headline || '').slice(0, 140),
      narrative: String(out.narrative || '').slice(0, 1200),
      ops: (Array.isArray(out.ops) ? out.ops : []).filter((o) => o && OPS.includes(o.type)),
      refused: (Array.isArray(out.refused) ? out.refused : []).slice(0, 6).map((r) => ({ text: String(r.text || '').slice(0, 200), reason: String(r.reason || '').slice(0, 200) })),
      reactions: Array.isArray(out.reactions) ? out.reactions : [],
    };
  }

  // ---------------------------------------------------------------- yapay zekâ olmadan: anahtar kelimeler
  function amountIn(t) {
    const m = t.match(/(\d[\d.,]*)\s*(bin|k\b|milyon)?/);
    if (!m) return null;
    let v = parseFloat(m[1].replace(/\./g, '').replace(',', '.'));
    if (m[2] === 'milyon') v *= 1000;
    else if (!m[2] && v >= 1000) v /= 1000; // "20000 asker" → 20 bin
    return v;
  }

  function parseClause(game, clause) {
    const t = norm(clause);
    const me = game.state.playerId;
    const nation = D().findNation(game, clause, [me]);
    const pct = t.match(/%\s*(\d+)|(\d+)\s*%|yüzde\s*(\d+)/);
    const pctVal = pct ? Number(pct[1] || pct[2] || pct[3]) : null;
    if (/dünya|tüm (kıta|ülkeler)|her yeri|bütün ülkeler|ölümsüz|sınırsız/.test(t)) return null;

    if (/vergi/.test(t)) {
      if (pctVal !== null) return { type: 'set_tax', value: pctVal };
      if (/artır|yükselt|arttır/.test(t)) return { type: 'set_tax', delta: 5 };
      if (/düşür|azalt|indir|kaldır/.test(t)) return { type: 'set_tax', delta: -5 };
    }
    if (/odak|odaklan|ağırlık ver|öncelik/.test(t)) {
      for (const [focus, re] of Object.entries(FOCUS_WORDS)) if (re.test(t)) return { type: 'set_focus', focus };
    }
    if (/paralı/.test(t)) return { type: 'mercenaries', amount: amountIn(t) || 5 };
    if (/terhis|orduyu küçült|asker azalt/.test(t)) return { type: 'disband', amount: amountIn(t) || 5 };
    if (/şenlik|festival|kutlama|bayram/.test(t)) return { type: 'festival' };
    if (/(inşa|kur|yap|aç|dik|yükselt)/.test(t)) {
      for (const [building, re] of Object.entries(BUILD_WORDS)) {
        if (re.test(t) && !/ittifak|ticaret anlaş/.test(t)) return { type: 'build', building, province: clause };
      }
    }
    if (/kolon|sömürge|yerleşim|yerleş|iskân/.test(t)) return { type: 'colonize', province: clause };
    if (/barış|ateşkes/.test(t) && nation) {
      const kind = /tazminat|haraç/.test(t) ? (/öde(r|yeceğiz|yelim)|ver(elim|eceğiz)|teklif/.test(t) ? 'offer' : 'demand') : 'white';
      return { type: 'offer_peace', nation, kind };
    }
    if (/taarruz|saldırıya geç|savunmaya geç|savunma hattı|dengeli/.test(t) && nation && game.warBetween(me, nation)) {
      const stance = /savunma/.test(t) ? 'defensive' : /dengeli/.test(t) ? 'balanced' : 'offensive';
      return { type: 'stance', nation, stance };
    }
    if (/savaş ilan|savaş aç|savaşa gir|istila|işgal et/.test(t) && nation) return { type: 'declare_war', nation };
    if (/saldır|kuşat|yürü|ordu(yu|larımızı)? (gönder|yolla)|fethet|ele geçir/.test(t)) {
      if (nation && !game.warBetween(me, nation)) return [{ type: 'declare_war', nation }, { type: 'attack', nation, province: clause }];
      return { type: 'attack', nation, province: clause };
    }
    if (/ittifak|müttefik/.test(t) && nation) return { type: /boz|sonlandır|çık|feshet|iptal/.test(t) ? 'break_alliance' : 'propose_alliance', nation };
    if (/ticaret/.test(t) && nation) return { type: /iptal|kes|bitir|sonlandır|ambargo/.test(t) ? 'cancel_trade' : 'propose_trade', nation };
    if (/ambargo|yaptırım/.test(t) && nation) return { type: 'cancel_trade', nation };
    if (/hediye|bağış|yardım gönder|altın gönder|para gönder/.test(t) && nation) return { type: 'gift', nation, amount: amountIn(t) || 50 };
    if (/(asker|ordu|seferberlik|tümen|alay)/.test(t) && /(topla|al|büyüt|güçlendir|seferber|kur|eğit|artır|ilan)/.test(t)) {
      return { type: 'recruit', amount: amountIn(t) || 5 };
    }
    if (/reform|yasa|kanun|propaganda|eğitim|altyapı|kalkınma|sağlık|vergi affı|af ilan/.test(t)) {
      const fx = {};
      if (/altyapı|kalkınma|eğitim|sağlık|yatırım/.test(t)) fx.capitalDev = 1;
      if (/propaganda|af|reform|yasa|kanun/.test(t)) fx.stability = 3;
      if (/barış|dostluk|diplomasi/.test(t)) fx.opinionAll = 2;
      const title = clause.trim().replace(/\s+(başlat|yap|ilan et|çıkar|uygula|yürürlüğe koy|et)$/i, '').slice(0, 60);
      return { type: 'policy', title: title.charAt(0).toLocaleUpperCase('tr') + title.slice(1), effects: fx };
    }
    return null;
  }

  function planOffline(game, text) {
    const clauses = String(text)
      .split(/[\n.;!?]+|,\s*(?=\S)|\s+ve\s+(?=[^,]*?(?:kur|yap|ilan|topla|saldır|indir|artır|düşür|gönder|inşa|aç|iptal|boz|öner|teklif))/u)
      .map((s) => s.trim())
      .filter((s) => s.length > 2);
    const ops = [];
    const refused = [];
    for (const c of clauses) {
      const r = parseClause(game, c);
      if (!r) refused.push({ text: c, reason: 'Kural tabanlı modda anlaşılamadı. Daha doğal anlatımlar için ⚙️ ayarlardan yapay zekâyı bağlayın.' });
      else ops.push(...(Array.isArray(r) ? r : [r]));
    }
    return { headline: '', narrative: '', ops, refused, reactions: [] };
  }

  // ---------------------------------------------------------------- etiketler
  const OP_LABEL = {
    set_tax: '💰 Vergi', set_focus: '🏭 Üretim odağı', recruit: '🪖 Asker toplama', mercenaries: '🗡️ Paralı asker',
    disband: '🏳️ Terhis', build: '🏗️ İnşaat', festival: '🎉 Şenlik', propose_trade: '📦 Ticaret', cancel_trade: '🚫 Ticaret iptali',
    propose_alliance: '🤝 İttifak', break_alliance: '💔 İttifak bozma', gift: '🎁 Hediye', declare_war: '⚔️ Savaş ilanı',
    offer_peace: '🕊️ Barış', stance: '🛡️ Cephe duruşu', attack: '🏹 Saldırı', colonize: '🏕️ Koloni', policy: '📜 Politika',
  };

  function headlineFor(game, results) {
    const P = game.nation(game.state.playerId);
    const ok = results.filter((r) => r.ok);
    if (!ok.length) return P.name + ' sarayında kararsız bir gün';
    const war = ok.find((r) => r.type === 'declare_war');
    if (war) return P.name + ' savaş ilan etti!';
    const al = ok.find((r) => r.type === 'propose_alliance');
    if (al) return 'Yeni ittifak: ' + al.message.replace(/ ittifakı kabul etti!?/, '') + ' ile omuz omuza';
    return P.name + ' yönetimi ' + ok.length + ' karar aldı';
  }

  // ---------------------------------------------------------------- dış arayüz
  /**
   * Oyuncunun yazdığı eylemleri işler.
   * Dönüş: { headline, narrative, results:[{type,label,ok,message,effects}], refused, reactions, usedLLM, warning }
   */
  async function submit(game, text, { useLLM = MH.llm?.enabled() } = {}) {
    const clean = String(text || '').trim().slice(0, 2000);
    if (!clean) throw new Error('Önce bir eylem yazın.');
    const me = game.state.playerId;
    if (!me || !game.nation(me)?.alive) throw new Error('Yönettiğiniz bir ülke yok.');
    let plan;
    let usedLLM = false;
    let warning;
    if (useLLM) {
      try {
        plan = await planWithLLM(game, clean);
        usedLLM = true;
      } catch (err) {
        warning = 'Yapay zekâ yanıt veremedi (' + err.message + '); kural tabanlı ayrıştırıcı kullanıldı.';
        plan = planOffline(game, clean);
      }
    } else plan = planOffline(game, clean);

    const results = [];
    for (const op of plan.ops.slice(0, MAX_OPS)) {
      let res;
      try {
        res = execute(game, op);
      } catch (err) {
        res = fail('Uygulanamadı: ' + err.message);
      }
      results.push({ type: op.type, label: OP_LABEL[op.type] || op.type, ok: !!res.ok, message: res.message, effects: res.effects || [] });
    }
    const reactions = applyReactions(game, me, plan.reactions);
    const entry = {
      day: game.state.day,
      text: clean,
      headline: plan.headline || headlineFor(game, results),
      narrative: plan.narrative,
      results,
      refused: plan.refused,
      reactions,
      ai: usedLLM,
    };
    game.state.actions = game.state.actions || [];
    game.state.actions.unshift(entry);
    if (game.state.actions.length > MAX_HISTORY) game.state.actions.length = MAX_HISTORY;
    if (results.some((r) => r.ok)) game.addLog('⚡ ' + entry.headline, 'player', [me]);
    game.emit('actions', entry);
    return { ...entry, usedLLM, warning };
  }

  /** Duruma göre kural tabanlı eylem fikirleri */
  function ideasOffline(game) {
    const me = game.state.playerId;
    const P = game.nation(me);
    const out = [];
    const enemies = game.enemiesOf(me);
    const budget = game.budget(me);
    if (P.stability < 40) out.push('Halkı yatıştırmak için başkentte büyük bir şenlik düzenle.');
    if (budget.total < 0) out.push('Bütçe açığını kapatmak için vergileri %' + Math.min(50, P.tax + 5) + "'e çıkar.");
    else if (P.gold > 200) out.push('Hazinedeki altınla en gelişmiş eyalette bir pazar inşa et.');
    if (enemies.length) {
      const foe = game.nation(enemies[0]);
      const war = game.warBetween(me, foe.id);
      if (game.warScore(war, me) > 25) out.push(foe.name + ' ile tazminat karşılığında barış yap.');
      else out.push(foe.name + ' cephesinde taarruza geç; ordunu ' + MH.places.nameOf(game, foe.capital) + ' üzerine yürüt.');
      if (P.manpower > 10 && P.gold > 80) out.push(Math.min(20, Math.floor(P.manpower)) + ' bin asker topla.');
    }
    const friends = game.aliveNations()
      .filter((n) => n.id !== me && !game.isAllied(me, n.id) && !game.warBetween(me, n.id))
      .sort((a, b) => game.opinion(b.id, me) - game.opinion(a.id, me));
    const ally = friends.find((n) => !game.allianceCheck(me, n.id));
    if (ally) out.push(ally.name + ' ile ittifak kur.');
    const trade = friends.find((n) => !game.tradeCheck(me, n.id));
    if (trade) out.push(trade.name + ' ile ticaret anlaşması imzala.');
    const cold = friends.filter((n) => game.neighborsOf(me).includes(n.id)).sort((a, b) => game.opinion(a.id, me) - game.opinion(b.id, me))[0];
    if (cold && game.opinion(cold.id, me) < 0) out.push(cold.name + ' ile ilişkileri düzeltmek için 50 altın hediye gönder.');
    const near = nearestUnclaimed(game, me);
    if (near >= 0) out.push(MH.places.nameOf(game, near) + ' topraklarında koloni kur.');
    if (!enemies.length && P.army < game.totalDev(me) * 0.3) out.push('Sınırları korumak için 10 bin asker topla ve bir kale inşa et.');
    out.push('Eğitim ve altyapı reformu başlat.');
    return out.slice(0, 6);
  }

  async function ideas(game, { useLLM = MH.llm?.enabled() } = {}) {
    if (!useLLM) return { ideas: ideasOffline(game), usedLLM: false };
    try {
      const out = await MH.llm.completeJSON({
        system: 'Sen "Map Historia" strateji oyununda oyuncuya danışmanlık yapan bir devlet adamısın. Türkçe yaz. Yalnızca {"ideas":["…"]} biçiminde JSON döndür.',
        messages: [{
          role: 'user',
          text: 'DURUM (JSON):\n' + JSON.stringify(contextFor(game)) +
            '\n\nOyuncunun bu tur yazabileceği 5 farklı, somut ve dönemine uygun eylem öner. Her biri tek cümle, emir kipinde olsun (ör. "Fransa ile ittifak kur"). Oyunun yapabildikleri: vergi, üretim odağı, asker toplama, inşaat (pazar, kışla, kale, mabet), şenlik, ticaret, ittifak, hediye, savaş ilanı, barış, cephe duruşu, saldırı, koloni, reform.',
        }],
        temperature: 0.9,
        maxTokens: 500,
      });
      const list = (Array.isArray(out.ideas) ? out.ideas : []).map((s) => String(s).slice(0, 160)).filter(Boolean).slice(0, 6);
      if (!list.length) throw new Error('boş liste');
      return { ideas: list, usedLLM: true };
    } catch (err) {
      return { ideas: ideasOffline(game), usedLLM: false, warning: 'Yapay zekâ fikir üretemedi (' + err.message + ').' };
    }
  }

  MH.actions = { submit, ideas, ideasOffline, planOffline, parseClause, execute, contextFor, OPS, OP_LABEL };
})((globalThis.MH = globalThis.MH || {}));

</script>
  <script>
/*
 * Map Historia — etkileşimli dünya haritası (AC 1.2, 3.2).
 * Gerçek sınırlardan üretilmiş eyalet poligonlarını SVG ile çizer. Eyalet sahipliği değiştiğinde
 * ilgili eyaletin rengi, ülke sınırları ve ülke adları anında güncellenir.
 */
(function (MH) {
  'use strict';

  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs = {}, parent) => {
    const node = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    if (parent) parent.appendChild(node);
    return node;
  };
  const f = (n) => Math.round(n * 10) / 10;
  const raf = (fn) => (typeof requestAnimationFrame === 'function' ? requestAnimationFrame(fn) : setTimeout(fn, 16));
  const UNCLAIMED = '#c9bd9c';
  const EARTH_KM = 6371;

  /** Karaya hafif arazi dokusu için tuvalde üretilen döşenebilir gürültü */
  function terrainTexture() {
    if (typeof document === 'undefined') return null;
    const size = 192;
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const ctx = c.getContext('2d');
    if (!ctx) return null;
    const img = ctx.createImageData(size, size);
    let seed = 7;
    const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
    const layers = [8, 16, 32, 64].map((n) => Array.from({ length: n * n }, rnd));
    const sample = (grid, n, x, y) => {
      const gx = (x / size) * n;
      const gy = (y / size) * n;
      const x0 = Math.floor(gx) % n;
      const y0 = Math.floor(gy) % n;
      const x1 = (x0 + 1) % n;
      const y1 = (y0 + 1) % n;
      const tx = gx - Math.floor(gx);
      const ty = gy - Math.floor(gy);
      const s = (t) => t * t * (3 - 2 * t);
      const a = grid[y0 * n + x0] + (grid[y0 * n + x1] - grid[y0 * n + x0]) * s(tx);
      const b = grid[y1 * n + x0] + (grid[y1 * n + x1] - grid[y1 * n + x0]) * s(tx);
      return a + (b - a) * s(ty);
    };
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        let v = 0;
        let amp = 0.5;
        layers.forEach((grid, i) => { v += sample(grid, [8, 16, 32, 64][i], x, y) * amp; amp *= 0.55; });
        const g = Math.round(150 + v * 105);
        const i = (y * size + x) * 4;
        img.data[i] = g;
        img.data[i + 1] = g;
        img.data[i + 2] = g;
        img.data[i + 3] = 255;
      }
    }
    ctx.putImageData(img, 0, 0);
    return c.toDataURL('image/png');
  }

  class MapView {
    constructor(svg, game, handlers = {}) {
      this.svg = svg;
      this.game = game;
      this.grid = game.grid;
      this.handlers = handlers;
      this.mode = 'political';
      this.selected = null;
      this.focusId = null; // diplomatik görünümde referans ulus
      this.dirty = { fills: true, borders: true, labels: true };
      this.abort = typeof AbortController !== 'undefined' ? new AbortController() : null;
      this._pxArea = this.grid.provinces.map((p) => {
        const k = this.grid.width / (2 * Math.PI * EARTH_KM * Math.cos((p.lat * Math.PI) / 180));
        return p.area * k * k;
      });
      this._build();
      this._bindInput();
      this.resetView();

      game.on('province', ({ id }) => {
        this._fillProv(id);
        this._flash(id);
        this.dirty.borders = true;
        this.dirty.labels = true;
        this.requestRender();
      });
      game.on('wars', () => {
        if (this.mode === 'diplomatic') this.dirty.fills = true;
        this.dirty.borders = true;
        this.requestRender();
      });
      game.on('day', () => this.requestStacks());
      game.on('buildings', () => this.renderBuildings());
      game.on('month', () => {
        if (this.mode === 'diplomatic') {
          this.dirty.fills = true;
          this.requestRender();
        }
      });
    }

    /** Dinleyicileri kaldırır (yeni oyunda harita yeniden kurulurken) */
    destroy() {
      this.abort?.abort();
      this.destroyed = true;
    }

    _build() {
      const svg = this.svg;
      const g = this.grid;
      svg.innerHTML = '';
      svg.setAttribute('xmlns', NS);
      const defs = el('defs', {}, svg);
      const pat = el('pattern', { id: 'hatch', width: 6, height: 6, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, defs);
      el('line', { x1: 0, y1: 0, x2: 0, y2: 6, stroke: 'rgba(170,20,20,.6)', 'stroke-width': 2.2 }, pat);
      const grad = el('linearGradient', { id: 'sea', x1: 0, y1: 0, x2: 0, y2: 1 }, defs);
      el('stop', { offset: '0%', 'stop-color': 'var(--sea-1)' }, grad);
      el('stop', { offset: '55%', 'stop-color': 'var(--sea-2)' }, grad);
      el('stop', { offset: '100%', 'stop-color': 'var(--sea-1)' }, grad);
      const tex = terrainTexture();
      if (tex) {
        const tp = el('pattern', { id: 'terrain', width: 96, height: 96, patternUnits: 'userSpaceOnUse' }, defs);
        el('image', { href: tex, width: 96, height: 96, preserveAspectRatio: 'none' }, tp);
      }

      this.root = el('g', {}, svg);
