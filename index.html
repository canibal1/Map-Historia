  <script>
/*
 * Map Historia — yapay zekâ ulusları.
 * Her ay çalışır: asker toplar, barış arar, zayıf ve sevmediği komşulara savaş açar,
 * dostlarıyla ittifak ve ticaret kurar. Oyuncuyu ilgilendiren kararlar olay olarak gelir.
 */
(function (MH) {
  'use strict';

  function monthly(game) {
    const st = game.state;
    const pid = st.playerId;
    for (const nat of game.aliveNations()) {
      if (nat.id === pid) continue;
      recruit(game, nat);
      invest(game, nat);
      seekPeace(game, nat);
      if (game.random() < 0.04) considerWar(game, nat);
      if (game.random() < 0.04) seekFriends(game, nat);
      if (nat.tax > 30 && nat.stability < 35) nat.tax -= 5;
      if (nat.tax < 30 && nat.gold < 30) nat.tax += 5;
    }
  }

  function recruit(game, nat) {
    const cap = game.totalDev(nat.id) * (game.warsOf(nat.id).length ? 0.9 : 0.6);
    const cost = game.recruitCost(nat.id) * 5;
    let n = 0;
    while (n < 4 && nat.army < cap && nat.manpower >= 5 && nat.gold > cost + 40 && game.budget(nat.id).total > 1) {
      game.recruit(nat.id, 5);
      n++;
    }
    // İnsan gücü tükenmiş zengin bir ülke savaşta paralı asker kiralar
    if (game.warsOf(nat.id).length && nat.manpower < 5 && nat.gold > 250 && nat.army < cap) game.hireMercenaries(nat.id, 5);
    if (nat.stability < 40 && nat.gold > game.festivalCost(nat.id) + 100) game.holdFestival(nat.id);
    if (game.budget(nat.id).total < 0 && nat.gold < 50 && nat.army > 10) game.disband(nat.id, 5);
  }

  /** Barış zamanında artan altını yapılara yatırır */
  function invest(game, nat) {
    if (game.warsOf(nat.id).length || nat.gold < 220 || game.random() > 0.3) return;
    const busy = new Set(game.state.construction.filter((c) => c.owner === nat.id).map((c) => c.pid));
    if (busy.size >= 2) return;
    const provs = game.provincesOf(nat.id).sort((a, b) => game.state.dev[b] - game.state.dev[a]);
    let type = 'market';
    const r = game.random();
    if (nat.stability < 50 && game.buildingsOf(nat.id, 'temple').length < 6) type = 'temple';
    else if (r < 0.2) type = 'barracks';
    else if (r < 0.35) type = 'fort';
    let candidates = provs;
    if (type === 'fort') {
      // Önce başkent, sonra sevilmeyen komşulara bakan zengin sınır eyaletleri
      const rivals = new Set(game.neighborsOf(nat.id).filter((n) => game.opinion(nat.id, n) <= -20));
      const border = provs.filter((p) => game.grid.provinces[p].neighbors.some((nb) => rivals.has(game.state.owner[nb])));
      candidates = [nat.capital, ...border];
    }
    const pid = candidates.find((p) => game.state.owner[p] === nat.id && !game.hasBuilding(p, type) && !busy.has(p));
    if (pid === undefined) return;
    if (game.buildingCost(pid, type) < nat.gold - 120) game.build(nat.id, pid, type);
  }

  function seekPeace(game, nat) {
    const pid = game.state.playerId;
    for (const war of game.warsOf(nat.id)) {
      const enemy = war.a === nat.id ? war.b : war.a;
      const score = game.warScore(war, nat.id);
      const months = (game.state.day - war.start) / 30;
      // Cephe duruşu: güçlüyken taarruz, kaybederken savunma
      const ratio = game.militaryStrength(nat.id) / Math.max(1, game.militaryStrength(enemy));
      war.stance = war.stance || {};
      war.stance[nat.id] = score <= -25 || ratio < 0.7 ? 'defensive' : ratio > 1.4 ? 'offensive' : 'balanced';
      if (enemy === pid) {
        // Kaybeden yapay zekâ oyuncuya barış teklif eder (olay olarak)
        const already = game.state.eventQueue.some((e) => (e.eventId === 'ai_peace_offer' || e.eventId === 'ai_peace_demand') && e.ctx.target === nat.id);
        const cooldown = war.lastOffer && game.state.day - war.lastOffer < 120;
        if (!already && !cooldown && months >= 2 && (score <= -35 || nat.warExhaustion >= 60) && game.random() < 0.35) {
          war.lastOffer = game.state.day;
          game.queueEvent('ai_peace_offer', pid, { target: nat.id, pay: score <= -35 });
        } else if (!already && !cooldown && months >= 2 && score >= 30 && game.random() < 0.5) {
          // Kazanan yapay zekâ şartlarını dayatır
          war.lastOffer = game.state.day;
          game.queueEvent('ai_peace_demand', pid, { target: nat.id });
        }
        continue;
      }
      // İki yapay zekâ arasındaki savaş
      let chance = 0;
      if (months >= 6 && (Math.abs(score) >= 40 || nat.warExhaustion >= 45)) chance = 0.25;
      if (months >= 24) chance = 0.5;
      if (chance && game.random() < chance) {
        game.offerPeace(nat.id, enemy, score <= -30 ? 'offer' : 'white', true);
      }
    }
  }

  function considerWar(game, nat) {
    if (game.warsOf(nat.id).length) return;
    if (nat.stability < 35 || nat.gold < 30) return;
    const pid = game.state.playerId;
    const myStr = game.militaryStrength(nat.id);
    const candidates = game
      .neighborsOf(nat.id)
      .filter((t) => !game.isAllied(nat.id, t) && !game.truceUntil(nat.id, t) && game.opinion(nat.id, t) <= -15)
      .filter((t) => {
        const target = game.nation(t);
        const defense = game.militaryStrength(t) + target.allies.reduce((s, a) => s + game.militaryStrength(a) * 0.5, 0);
        return myStr > defense * 1.4;
      });
    if (!candidates.length) return;
    const target = game.pick(candidates);
    const res = game.declareWar(nat.id, target);
    if (res.ok && target === pid) game.queueEvent('war_declared', pid, { target: nat.id });
    else if (res.ok && pid && game.warBetween(pid, nat.id)) {
      game.addLog(nat.name + ' sizinle savaşa girdi.', 'bad', [nat.id, pid]);
    }
  }

  function seekFriends(game, nat) {
    const pid = game.state.playerId;
    const others = game.aliveNations().filter((o) => o.id !== nat.id && !game.warBetween(o.id, nat.id));
    if (!others.length) return;
    const o = game.pick(others);
    const mine = game.opinion(nat.id, o.id);
    if (o.id === pid) {
      const pending = game.state.eventQueue.some((e) => e.eventId === 'ai_alliance_offer');
      if (!pending && mine >= 60 && !game.isAllied(nat.id, pid) && nat.allies.length < 4 && o.allies.length < 4 && !game.enemiesOf(nat.id).some((e) => game.isAllied(e, pid))) {
        game.queueEvent('ai_alliance_offer', pid, { target: nat.id });
      }
      return;
    }
    if (mine >= 0 && game.opinion(o.id, nat.id) >= 0 && !game.hasTrade(nat.id, o.id) && nat.trade.length < 4) {
      game.proposeTrade(nat.id, o.id);
    } else if (mine >= 55 && game.opinion(o.id, nat.id) >= 55 && !game.isAllied(nat.id, o.id)) {
      game.proposeAlliance(nat.id, o.id);
    }
  }

  MH.ai = { monthly };
})((globalThis.MH = globalThis.MH || {}));

      text: 'Bir mucit, düşman şehirlerini havadan gözetleyebilecek dev hava gemileri tasarladı. (Kurgusal olay)',
      weight: 4,
      once: true,
      options: [
        {
          text: 'Programı finanse et',
          effects: { gold: -90 },
          random: [
            { weight: 55, text: 'Hava keşfi orduya büyük üstünlük sağladı.', effects: { army: 12, stability: 3 } },
            { weight: 45, text: 'Prototip test uçuşunda alev aldı.', effects: { stability: -4 } },
          ],
        },
        { text: 'Kaynakları siperlere aktar', effects: { army: 4 } },
      ],
    },
  ];

  const BY_ID = Object.fromEntries(EVENTS.map((e) => [e.id, e]));

  function textOf(game, ev, ctx) {
    return typeof ev.text === 'function' ? ev.text(game, ctx) : ev.text;
  }

  /** Belirli tarihli olayları kontrol eder (her gün) */
  function checkScheduled(game) {
    const st = game.state;
    if (!st.playerId) return;
    for (const ev of EVENTS) {
      if (!ev.date || ev.scenario !== st.scenarioId || st.firedEvents[ev.id]) continue;
      const due = MH.util.parseDay(ev.date);
      if (st.day < due || st.day > due + 60) continue;
      const target = ev.nation === '*player' ? st.playerId : ev.nation;
      if (!alive(game, target)) { st.firedEvents[ev.id] = st.day; continue; }
      if (ev.condition && !ev.condition(game, target, {})) continue;
      st.firedEvents[ev.id] = st.day;
      if (target === st.playerId) {
        game.queueEvent(ev.id, target, {});
      } else {
        const res = apply(game, { eventId: ev.id, nationId: target, ctx: {} }, ev.aiChoice ?? 0);
        game.addLog(ev.icon + ' ' + ev.title + ' — ' + name(game, target) + ': ' + res.message, 'world', [target]);

  }

  function checkRandom(game) {

    const id = st.playerId;
    if (!id || !alive(game, id) || st.eventQueue.length) return;
    if (st.day - st.lastEventDay < MIN_GAP_DAYS) return;
    if (game.random() > MONTHLY_CHANCE) return;
    const pool = [];
    for (const ev of EVENTS) {
      if (ev.date || ev.dynamic) continue;
      if (ev.scenario && ev.scenario !== st.scenarioId) continue;
      const last = st.firedEvents[ev.id];
      if (last !== undefined && (ev.once || st.day - last < REPEAT_COOLDOWN)) continue;
      if (ev.condition && !ev.condition(game, id, {})) continue;
      pool.push(ev);
    }
    let total = pool.reduce((s, e) => s + (e.weight || 5), 0);
    let r = game.random() * total;
    for (const ev of pool) {
      r -= ev.weight || 5;
      if (r > 0) continue;

      st.firedEvents[ev.id] = st.day;
      st.lastEventDay = st.day;
      game.queueEvent(ev.id, id, ctx);
      return;
    }

  function pickWeighted(game, list) {
    const total = list.reduce((s, o) => s + o.weight, 0);
    let r = game.random() * total;
    for (const o of list) {
      r -= o.weight;

  /** Seçilen seçeneği uygular; { ok, message, effects } döndürür */
  function apply(game, pending, index) {
    const ev = BY_ID[pending.eventId];
    const opt = ev?.options[index];
    if (!opt) return { ok: false, message: 'Geçersiz seçenek', effects: [] };
    const id = pending.nationId;
    const ctx = pending.ctx || {};
    let effects = game.applyEffects(id, opt.effects, ctx);
    if (opt.run) effects = effects.concat(opt.run(game, id, ctx) || []);
    let message = opt.text;
    if (opt.random) {
      const outcome = pickWeighted(game, opt.random);
      message = outcome.text;
      effects = effects.concat(game.applyEffects(id, outcome.effects, ctx));
      if (outcome.run) effects = effects.concat(outcome.run(game, id, ctx) || []);
    }
    if (id === game.state.playerId) game.addLog(ev.icon + ' ' + ev.title + ': ' + message, 'event', [id]);
    return { ok: true, message, effects };
  }

  const FX_LABELS = {
    gold: ['Altın'], goldPct: ['Altın', '%'], manpower: ['İnsan gücü', 'k'], manpowerPct: ['İnsan gücü', '%'],
    army: ['Ordu', 'k'], armyPct: ['Ordu', '%'], stability: ['İstikrar'], warExhaustion: ['Savaş yorgunluğu'],
    tax: ['Vergi oranı', 'pp'], capitalDev: ['Başkent gelişimi'], devAll: ['Tüm eyaletlerin gelişimi'],
    opinionTarget: ['Hedef ülke ilişkisi'], opinionNeighbors: ['Komşu ilişkileri'], opinionAll: ['Tüm ülkelerle ilişki'],
  };

  /** Bir seçeneğin etkilerini önizleme için listeler: [[etiket, değer, birim]] */
  function preview(game, pending, opt) {
    const out = [];
    const fx = opt.effects || {};
    for (const [k, v] of Object.entries(fx)) {
      if (k === 'opinionWith') {
        for (const [other, val] of Object.entries(v)) if (alive(game, other)) out.push([name(game, other) + ' ilişkisi', val]);
        continue;
      }
      const [label, unit] = FX_LABELS[k] || [k];
      const lbl = k === 'opinionTarget' && pending.ctx?.target ? name(game, pending.ctx.target) + ' ilişkisi' : label;
      out.push([lbl, unit === '%' ? Math.round(v * 100) : v, unit === '%' ? '%' : unit]);
    }
    if (opt.hint) out.push([opt.hint, null]);
    if (opt.random) out.push(['Sonuç belirsiz (' + opt.random.map((r) => '%' + r.weight).join(' / ') + ')', null]);
    return out;
  }

  MH.events = { EVENTS, BY_ID, checkScheduled, checkRandom, apply, preview, textOf };

  <script>
/*
 * Map Historia — haritada hareket eden ordular ve kuşatmalar.
 *
 * Oyuncunun dahil olduğu savaşlar somut ordularla yürür: oyuncunun ve düşmanlarının
 * orduları eyaletten eyalete hareket eder, aynı eyalette karşılaşınca muharebe olur,
 * düşman eyaletinde duran ordu kuşatma başlatır ve kuşatma bitince eyalet el değiştirir.
 * Yapay zekâ ile yapay zekâ arasındaki savaşlar engine.js'deki soyut cephe modeliyle sürer.
 *
 * Bir ulusun ordularının toplamı her zaman nation.army ile eşitlenir; böylece asker toplama,
 * olaylar ve bakım gibi tüm mevcut kurallar ordulara da yansır.
 */
(function (MH) {
  'use strict';

  const STEP_DAYS = 4; // kendi/müttefik toprağında bir eyalet
  const ENEMY_STEP_DAYS = 5;
  const STRAIT_EXTRA_DAYS = 4;
  const THINK_EVERY = 4; // otomatik komutanların karar aralığı (gün)
  const SHATTER_DAYS = 12; // yenilen ordu bu süre savaşamaz

  const round1 = (v) => Math.round(v * 10) / 10;

  // ------------------------------------------------------------------ yardımcılar
  function stacksOf(game, id) {
    return game.state.stacks.filter((s) => s.owner === id);
  }

  function stackById(game, sid) {
    return game.state.stacks.find((s) => s.id === sid) || null;
  }

  /** Oyuncuyu içeren savaşlarda bir ulusun karşısındakiler */
  function theaterEnemies(game, id) {
    const pid = game.state.playerId;
    if (!pid) return [];
    if (id === pid) return game.enemiesOf(pid);
    return game.warBetween(id, pid) ? [pid] : [];
  }

  function hostile(game, a, b) {
    return a !== b && !!game.warBetween(a, b);
  }

  function canEnter(game, owner, prov, returning) {
    const o = game.state.owner[prov];
    if (returning || o === owner) return true;
    return game.isAllied(owner, o) || hostile(game, owner, o);
  }

  function stepDays(game, owner, from, to) {
    const p = game.grid.provinces[from];
    let d = hostile(game, owner, game.state.owner[to]) ? ENEMY_STEP_DAYS : STEP_DAYS;
    if (!p.neighbors.includes(to)) d += STRAIT_EXTRA_DAYS;
    return d;
  }

  /** Dijkstra: geçilebilir eyaletler üzerinden gün cinsinden mesafeler */
  function distancesFrom(game, start, owner, returning = false) {
    const { provinces } = game.grid;
    const n = provinces.length;
    const dist = new Float64Array(n).fill(Infinity);
    const prev = new Int32Array(n).fill(-1);
    dist[start] = 0;
    const heap = [[0, start]];
    const push = (item) => {
      heap.push(item);
      let i = heap.length - 1;
      while (i > 0) {
        const p = (i - 1) >> 1;
        if (heap[p][0] <= heap[i][0]) break;
        [heap[p], heap[i]] = [heap[i], heap[p]];
        i = p;
      }
    };
    const pop = () => {
      const top = heap[0];
      const last = heap.pop();
      if (heap.length) {
        heap[0] = last;
        let i = 0;
        for (;;) {
          const l = 2 * i + 1;
          const r = l + 1;
          let m = i;
          if (l < heap.length && heap[l][0] < heap[m][0]) m = l;
          if (r < heap.length && heap[r][0] < heap[m][0]) m = r;
          if (m === i) break;
          [heap[m], heap[i]] = [heap[i], heap[m]];
          i = m;
        }
      }
      return top;
    };
    while (heap.length) {
      const [d, cur] = pop();
      if (d > dist[cur]) continue;
      const p = provinces[cur];
      for (const nb of p.neighbors.concat(p.straits)) {
        if (!canEnter(game, owner, nb, returning)) continue;
        const nd = d + stepDays(game, owner, cur, nb);
        if (nd < dist[nb]) {
          dist[nb] = nd;
          prev[nb] = cur;
          push([nd, nb]);
        }
      }
    }
    return { dist, prev };
  }

  function buildPath(prev, start, target) {
    const path = [];
    for (let cur = target; cur !== start; cur = prev[cur]) {
      if (cur < 0) return null;
      path.unshift(cur);
    }
    return path;
  }

  function placeName(game, pid) {
    return MH.places ? MH.places.nameOf(game, pid) : game.nation(game.state.owner[pid]).name;
  }

  function quality(game, id) {
    return game.quality(id);
  }

  function strength(game, stack) {
    return stack.size * quality(game, stack.owner);
  }

  function homeProvince(game, id) {
    const nat = game.nation(id);
    if (game.state.owner[nat.capital] === id) return nat.capital;
    return game.provincesOf(id)[0] ?? -1;

  function newStack(game, owner, prov, size, name) {
    const st = game.state;
    const stack = {
      id: st.nextStackId++,
      owner,
      prov,
      size: round1(size),
      path: [],

    const used = new Set(stacksOf(game, owner).map((s) => s.name));
    for (let i = 1; ; i++) {
      const name = i + '. Ordu';
      if (!used.has(name)) return name;
    }
  }

  function removeStack(game, stack) {
    game.state.stacks = game.state.stacks.filter((s) => s !== stack);
  }

  // ------------------------------------------------------------------ yaşam döngüsü
  function init(game) {
    const st = game.state;
    st.stacks = st.stacks || [];
    st.sieges = st.sieges || {};
    st.nextStackId = st.nextStackId || 1;
    ensureStacks(game);
  }

  /** Oyuncu ve oyuncuyla savaştaki uluslar için orduları oluşturur/temizler */
  function ensureStacks(game) {
    const st = game.state;
    const pid = st.playerId;
    if (!pid) return;
    const inTheater = new Set([pid, ...game.enemiesOf(pid)]);
    // Artık oyuncuyla savaşmayan yapay zekâ orduları dağılır (askerler nation.army'de kalır)
    st.stacks = st.stacks.filter((s) => inTheater.has(s.owner) && game.nation(s.owner).alive);
    for (const id of inTheater) {
      const nat = game.nation(id);
      if (!nat.alive) continue;
      const mine = stacksOf(game, id);
      if (!mine.length && nat.army >= 1) {
        const home = homeProvince(game, id);
        if (home < 0) continue;
        if (id === pid) {
          newStack(game, id, home, nat.army, '1. Ordu');
        } else {
          // Yapay zekâ: bir ordu oyuncuya en yakın sınırda, varsa ikincisi başkentte
          const k = nat.army >= 150 ? 3 : nat.army >= 50 ? 2 : 1;
          const front = frontierToward(game, id, pid);
          const spots = [front ?? home, home, home];
          const size = nat.army * theaterShare(game, id);
          for (let i = 0; i < k; i++) newStack(game, id, spots[i], size / k, nat.name + (k > 1 ? ' ' + (i + 1) + '. Ordusu' : ' Ordusu'));
        }
      }
      sync(game, id);
    }
  }

  /** `id` ulusunun `toward` ulusuna en yakın eyaleti */
  function frontierToward(game, id, toward) {
    const { provinces } = game.grid;
    const owner = game.state.owner;
    for (let i = 0; i < owner.length; i++) {
      if (owner[i] !== id) continue;
      const p = provinces[i];
      if (p.neighbors.some((nb) => owner[nb] === toward) || p.straits.some((nb) => owner[nb] === toward)) return i;
    }
    return null;
  }

  /**
   * Yapay zekâ ulusunun ordusunun oyuncuya karşı cepheye düşen payı.
   * Aynı anda başka yapay zekâ uluslarıyla da savaşıyorsa ordusu cephelere duruş ağırlığıyla bölünür
   * (engine.js'deki soyut model de aynı bölüşümü kullanır), böylece asker iki kez sayılmaz.
   */
  function theaterShare(game, id) {
    const pid = game.state.playerId;
    if (id === pid) return 1;
    let total = 0;
    let mine = 0;
    for (const w of game.warsOf(id)) {
      const vsPlayer = w.a === pid || w.b === pid;
      if (!vsPlayer && !game._frontier(w.a, w.b).length && !game._frontier(w.b, w.a).length) continue;
      const wt = MH.STANCES[game.stanceOf(w, id)].weight;
      total += wt;
      if (vsPlayer) mine += wt;
    }
    return total && mine ? mine / total : 1;
  }

  /** Ordu toplamını hedefle eşitler: yeni askerler başkentteki orduya katılır, kayıplar orantılı dağılır */
  function sync(game, id) {
    const nat = game.nation(id);
    const mine = stacksOf(game, id);
    if (!mine.length) return;
    const goal = Math.max(0, nat.army) * theaterShare(game, id);
    const total = mine.reduce((s, x) => s + x.size, 0);
    const diff = goal - total;
    if (Math.abs(diff) < 0.05) return;
    if (diff > 0) {
      const home = homeProvince(game, id);
      const target = mine.find((s) => s.prov === home && !s.shattered) || mine.reduce((a, b) => (b.size > a.size ? b : a));
      target.size = round1(target.size + diff);
    } else if (total > 0) {
      const f = goal / total;
      for (const s of mine) s.size = round1(s.size * f);
    }
    for (const s of mine) if (s.size < 0.5) removeStack(game, s);
    // Yuvarlama artığını en büyük orduya yaz
    const left = stacksOf(game, id);
    if (left.length) {
      const sum = left.reduce((s, x) => s + x.size, 0);
      const big = left.reduce((a, b) => (b.size > a.size ? b : a));
      big.size = round1(Math.max(0, big.size + goal - sum));
    }
  }

  // ------------------------------------------------------------------ oyuncu emirleri
  function moveStack(game, sid, target) {
    const stack = stackById(game, sid);
    if (!stack) return game._result(false, 'Ordu bulunamadı.');
    if (stack.owner !== game.state.playerId) return game._result(false, 'Bu ordu sizin değil.');
    if (stack.prov === target) {
      stack.path = [];
      stack.auto = false;
      return game._result(true, stack.name + ' yerinde bekliyor.');
    }
    const ownerOfTarget = game.state.owner[target];
    if (!canEnter(game, stack.owner, target, stack.returning)) {
      return game._result(false, game.nation(ownerOfTarget).name + ' topraklarına giriş izniniz yok (savaş ya da ittifak gerekli).');
    }
    const { dist, prev } = distancesFrom(game, stack.prov, stack.owner, stack.returning);
    if (!isFinite(dist[target])) return game._result(false, 'Oraya giden bir yol yok.');
    stack.path = buildPath(prev, stack.prov, target);
    stack.progress = 0;
    stack.auto = false;
    const days = Math.round(dist[target]);
    const siege = hostile(game, stack.owner, ownerOfTarget) ? ' Varınca kuşatma başlayacak.' : '';
    return game._result(true, stack.name + ' yola çıktı: ~' + days + ' gün.' + siege, [[stack.path.length + ' eyalet', null]]);
  }

  function setAuto(game, sid, auto) {
    const stack = stackById(game, sid);
    if (!stack || stack.owner !== game.state.playerId) return game._result(false, 'Ordu bulunamadı.');
    stack.auto = !!auto;
    stack.think = 0;
    return game._result(true, stack.name + (auto ? ' otomatik komutaya geçti.' : ' artık sizin emirlerinizi bekliyor.'));
  }

  function splitStack(game, sid) {
    const stack = stackById(game, sid);
    if (!stack || stack.owner !== game.state.playerId) return game._result(false, 'Ordu bulunamadı.');
    if (stack.size < 4) return game._result(false, 'Bölünemeyecek kadar küçük.');
    const half = round1(stack.size / 2);
    stack.size = round1(stack.size - half);
    const other = newStack(game, stack.owner, stack.prov, half, nextName(game, stack.owner));
    other.auto = stack.auto;
    other.shattered = stack.shattered;
    return game._result(true, stack.name + ' ikiye bölündü: ' + other.name + ' kuruldu.');
  }

  function mergeStacks(game, sid) {
    const stack = stackById(game, sid);
    if (!stack || stack.owner !== game.state.playerId) return game._result(false, 'Ordu bulunamadı.');
    const others = stacksOf(game, stack.owner).filter((s) => s !== stack && s.prov === stack.prov);
    if (!others.length) return game._result(false, 'Aynı eyalette birleşecek başka ordu yok.');
    for (const o of others) {
      stack.size = round1(stack.size + o.size);
      removeStack(game, o);
    }
    return game._result(true, others.length + ' ordu ' + stack.name + ' altında birleşti.');
  }

  // ------------------------------------------------------------------ günlük işleyiş
  function daily(game) {
    const st = game.state;
    if (!st.playerId || st.gameOver) return;
    st.stacks = st.stacks || [];
    st.sieges = st.sieges || {};
    ensureStacks(game);
    relocateStranded(game);
    for (const stack of [...st.stacks]) {
      if (stack.shattered > 0) stack.shattered--;
      if (stack.auto && !stack.shattered && --stack.think <= 0) {
        stack.think = THINK_EVERY;
        autoCommand(game, stack);
      }
      advance(game, stack);
    }
    resolveBattles(game);
    progressSieges(game);
  }

  /** Barıştan sonra düşman ya da tarafsız topraklarda kalan oyuncu orduları sınırın gerisine çekilir */
  function relocateStranded(game) {
    for (const stack of game.state.stacks) {
      const o = game.state.owner[stack.prov];
      if (o === stack.owner || game.isAllied(stack.owner, o) || hostile(game, stack.owner, o)) {
        stack.returning = false;
        continue;
      }
      if (stack.returning) continue;
      stack.returning = true;
      const { dist, prev } = distancesFrom(game, stack.prov, stack.owner, true);
      let best = -1;
      game.state.owner.forEach((ow, i) => {
        if (ow === stack.owner && (best < 0 || dist[i] < dist[best])) best = i;
      });
      if (best >= 0) {
        stack.path = buildPath(prev, stack.prov, best) || [];
        stack.progress = 0;
      }
    }
  }

  /** Yeni rota; ilk adım aynıysa yoldaki ilerleme korunur (yoksa hareketli hedefi kovalayan ordu hiç varamaz) */
  function setPath(stack, path) {
    if (stack.path[0] !== path[0]) stack.progress = 0;
    stack.path = path;
  }

  function advance(game, stack) {
    if (!stack.path.length) return;
    const next = stack.path[0];
    if (!canEnter(game, stack.owner, next, stack.returning)) {
      stack.path = [];
      return;
    }
    stack.progress++;
    if (stack.progress < stepDays(game, stack.owner, stack.prov, next)) return;
    stack.progress = 0;
    stack.prov = next;
    stack.path.shift();
    if (!stack.path.length && stack.returning && game.state.owner[stack.prov] === stack.owner) stack.returning = false;
  }

  /** Yapay zekâ orduları ve otomatik komutadaki oyuncu orduları için karar */
  function autoCommand(game, stack) {
    const st = game.state;
    const owner = stack.owner;
    const enemies = theaterEnemies(game, owner);
    if (!enemies.length || stack.returning) return;
    const enemySet = new Set(enemies);
    const { dist, prev } = distancesFrom(game, stack.prov, owner);
    const go = (target) => {
      if (target === stack.prov) {
        stack.path = [];
        return;
      }
      const path = buildPath(prev, stack.prov, target);
      if (path && (stack.path.length === 0 || stack.path[stack.path.length - 1] !== target)) setPath(stack, path);
    };
    const mine = strength(game, stack);
    const foes = st.stacks.filter((s) => enemySet.has(s.owner) && !s.shattered && isFinite(dist[s.prov]));
    // Duruş: oyuncu için en büyük düşmana karşı seçilen duruş; yapay zekâ için oyuncuya karşı duruşu
    const mainEnemy = enemies.reduce((a, b) => (game.nation(b).army > game.nation(a).army ? b : a));
    const war = game.warBetween(owner, mainEnemy);
    const stance = war ? game.stanceOf(war, owner) : 'balanced';

    // 1) Yakındaki çok güçlü düşmandan kaç
    const danger = foes.find((f) => dist[f.prov] <= 2 * ENEMY_STEP_DAYS && strength(game, f) > mine * 1.6);
    if (danger && stance !== 'offensive') {
      const home = homeProvince(game, owner);
      if (home >= 0 && home !== stack.prov) {
        const path = buildPath(prev, stack.prov, home);
        if (path) setPath(stack, path);
      }
      return;
    }
    // 2) Yenebileceği yakın bir düşman ordusuna saldır (kendi topraklarındakiler öncelikli)
    let target = null;
    let bestScore = -Infinity;
    const reach = stance === 'defensive' ? 3 * STEP_DAYS : 8 * ENEMY_STEP_DAYS;
    for (const f of foes) {
      if (dist[f.prov] > reach) continue;
      const ratio = mine / Math.max(0.1, strength(game, f));
      if (ratio < (stance === 'offensive' ? 0.95 : 1.15)) continue;
      const score = ratio * 10 - dist[f.prov] + (st.owner[f.prov] === owner ? 25 : 0);
      if (score > bestScore) { bestScore = score; target = f.prov; }
    }
    if (target !== null) return go(target);
    // 3) Kuşatma: taarruz/dengeli duruşta en yakın düşman eyaleti
    if (stance !== 'defensive') {
      const strongestFoe = foes.reduce((m, f) => Math.max(m, strength(game, f)), 0);
      if (stance === 'offensive' || mine >= strongestFoe * 0.8) {
        let best = -1;
        let bestCost = Infinity;
        st.owner.forEach((o, i) => {
          if (!enemySet.has(o) || !isFinite(dist[i])) return;
          // Başka bir ordumuzun hedeflediği eyalet yerine yenisini seç; başkentler cazip hedeflerdir
          const taken = st.stacks.some((s) => s !== stack && s.owner === owner && (s.prov === i || s.path[s.path.length - 1] === i));
          const cost = dist[i] + (taken ? 30 : 0) - (game.nation(o).capital === i ? 6 : 0);
          if (cost < bestCost) { bestCost = cost; best = i; }
        });
        if (best >= 0) return go(best);
      }
    }
    // 4) Savunma: kuşatılan kendi eyaletine ya da düşmana en yakın sınıra git
    const besieged = Object.keys(st.sieges).map(Number).filter((p) => st.owner[p] === owner && isFinite(dist[p]));
    if (besieged.length) return go(besieged.reduce((a, b) => (dist[b] < dist[a] ? b : a)));
    const front = frontierToward(game, owner, mainEnemy);
    if (front !== null && isFinite(dist[front])) go(front);
  }

  function resolveBattles(game) {
    const st = game.state;
    const byProv = new Map();
    for (const s of st.stacks) {
      if (s.shattered) continue;
      if (!byProv.has(s.prov)) byProv.set(s.prov, []);
      byProv.get(s.prov).push(s);
    }
    const pid = st.playerId;
    for (const [prov, here] of byProv) {
      const ours = here.filter((s) => s.owner === pid);
      const theirs = here.filter((s) => s.owner !== pid && hostile(game, s.owner, pid));
      if (!ours.length || !theirs.length) continue;
      battle(game, prov, ours, theirs);
    }
  }

  function battle(game, prov, ours, theirs) {
    const st = game.state;
    const pid = st.playerId;
    const provOwner = st.owner[prov];
    const fort = game.hasBuilding(prov, 'fort') ? 1.15 : 1;
    const terrain = (side) => (side.some((s) => s.owner === provOwner) ? 1.25 * fort : 1);
    const sP = ours.reduce((a, s) => a + strength(game, s), 0) * terrain(ours);
    const sE = theirs.reduce((a, s) => a + strength(game, s), 0) * terrain(theirs);
    const pWin = (sP ** 1.5 + 0.1) / (sP ** 1.5 + sE ** 1.5 + 0.2);
    const playerWon = game.random() < pWin;
    const [winners, losers, sW, sL] = playerWon ? [ours, theirs, sP, sE] : [theirs, ours, sE, sP];
    const lossShare = sL / Math.max(1, sW + sL);
    let lossW = 0;
    let lossL = 0;
    for (const s of losers) {
      const l = round1(Math.min(s.size, s.size * (0.25 + game.random() * 0.15) + 0.5));
      s.size = round1(s.size - l);
      game.nation(s.owner).army = round1(game.nation(s.owner).army - l);
      lossL += l;
    }
    for (const s of winners) {
      const l = round1(Math.min(s.size, s.size * (0.06 + game.random() * 0.08) * lossShare * 2));
      s.size = round1(s.size - l);
      game.nation(s.owner).army = round1(game.nation(s.owner).army - l);
      lossW += l;
    }
    const mainLoser = losers.reduce((a, b) => (b.size > a.size ? b : a)).owner;
    const mainWinner = winners.reduce((a, b) => (b.size > a.size ? b : a)).owner;
    const war = game.warBetween(mainWinner, mainLoser);
    if (war) war.battles[mainWinner] = (war.battles[mainWinner] || 0) + 2;
    game.nation(mainLoser).warExhaustion = Math.min(100, game.nation(mainLoser).warExhaustion + 2);
    // Yenilen ordular dağılır ya da geri çekilir
    for (const s of losers) {
      if (s.size < 0.5) {
        removeStack(game, s);
        continue;
      }
      s.shattered = SHATTER_DAYS;
      retreat(game, s);
    }
    for (const s of winners) if (s.size < 0.5) removeStack(game, s);
    // Kuşatmayı yalnızca kuşatanın yenilgisi bozar
    if (st.sieges[prov] && losers.some((s) => s.owner === st.sieges[prov].by)) delete st.sieges[prov];
    game.emit('battle', { war, winner: mainWinner, loser: mainLoser, lossW: round1(lossW), lossL: round1(lossL), province: prov, field: true });
    if (playerWon || losers.some((s) => s.owner === pid)) {
      game.addLog(
        (playerWon ? '🏆 Meydan muharebesi kazanıldı: ' : '💥 Meydan muharebesi kaybedildi: ') +
          game.nation(playerWon ? mainLoser : mainWinner).name + ' (kayıplar ' + Math.round((playerWon ? lossW : lossL) * 1000).toLocaleString('tr-TR') + ')',
        playerWon ? 'good' : 'bad',
        [pid],
      );
    }
  }

  function retreat(game, stack) {
    const { dist, prev } = distancesFrom(game, stack.prov, stack.owner);
    const enemyAt = new Set(game.state.stacks.filter((s) => hostile(game, s.owner, stack.owner)).map((s) => s.prov));
    let best = -1;
    game.state.owner.forEach((o, i) => {
      if (o !== stack.owner || enemyAt.has(i) || !isFinite(dist[i]) || i === stack.prov) return;
      if (best < 0 || dist[i] < dist[best]) best = i;
    });
    if (best < 0) {
      // Kaçacak yer yok: ordu teslim olur
      game.nation(stack.owner).army = round1(game.nation(stack.owner).army - stack.size);
      removeStack(game, stack);
      return;
    }
    stack.path = buildPath(prev, stack.prov, best) || [];
    stack.progress = 0;
  }

  function siegeNeeded(game, prov) {
    const owner = game.state.owner[prov];
    const nat = game.nation(owner);
    let days = 12 + game.state.dev[prov] * 2;
    if (nat.capital === prov) days += 25;
    if (game.provincesOf(owner).length === 1) days += 20;
    if (game.hasBuilding(prov, 'fort')) days += 25;
    return Math.round(days);
  }

  function progressSieges(game) {
    const st = game.state;
    const active = new Map();
    for (const s of st.stacks) {
      if (s.shattered || s.path.length) continue;
      const o = st.owner[s.prov];
      if (!hostile(game, s.owner, o)) continue;
      const enemyHere = st.stacks.some((x) => x.prov === s.prov && x.owner === o && !x.shattered);
      if (enemyHere) continue;
      // Büyük ordu daha hızlı kuşatır, ama surlar bir sınırın altına indirilemez
      const rate = Math.max(0.25, Math.min(1.2, s.size / (8 + st.dev[s.prov] * 2)));
      const cur = active.get(s.prov) || { by: s.owner, rate: 0 };
      cur.rate += rate;
      active.set(s.prov, cur);
    }
    for (const prov of Object.keys(st.sieges)) if (!active.has(Number(prov))) delete st.sieges[prov];
    for (const [prov, { by, rate }] of active) {
      const isNew = !(st.sieges[prov] && st.sieges[prov].by === by);
      const sg = isNew ? { by, progress: 0 } : st.sieges[prov];
      if (isNew && st.owner[prov] === st.playerId) {
        game.addLog('🏰 ' + game.nation(by).name + ' ' + placeName(game, prov) + ' kuşatmasını başlattı!', 'bad', [st.playerId]);
        game.emit('siege', { province: prov, by });
      }
      sg.progress = round1(sg.progress + rate);
      sg.needed = siegeNeeded(game, prov);
      st.sieges[prov] = sg;
      if (sg.progress >= sg.needed) {
        const loser = st.owner[prov];
        delete st.sieges[prov];
        const war = game.warBetween(by, loser);
        game.transferProvince(prov, by, war);
        if (war) war.battles[by] = (war.battles[by] || 0) + 1;
      }
    }
  }

  function cleanup(game, id) {
    game.state.stacks = (game.state.stacks || []).filter((s) => s.owner !== id);
  }

  /** Ordunun durumu (arayüz için) */
  function status(game, stack) {
    const st = game.state;
    if (stack.returning) return { kind: 'return', text: 'Sınırın gerisine çekiliyor' };
    if (stack.shattered) return { kind: 'shattered', text: 'Dağınık (' + stack.shattered + ' gün)' };
    const sg = st.sieges[stack.prov];
    if (sg && sg.by === stack.owner && !stack.path.length) {
      return { kind: 'siege', text: 'Kuşatma: ' + placeName(game, stack.prov) + ' %' + Math.min(99, Math.round((sg.progress / sg.needed) * 100)) };
    }
    if (stack.path.length) return { kind: 'move', text: 'Yürüyüşte (' + stack.path.length + ' eyalet)' };
    return { kind: 'idle', text: 'Beklemede' };
  }

  MH.armies = {
    init, daily, ensureStacks, sync, theaterShare, stacksOf, stackById, moveStack, setAuto, splitStack, mergeStacks,
    status, cleanup, distancesFrom, siegeNeeded, strength,
  };
})((globalThis.MH = globalThis.MH || {}));

</script>
  <script>
/*
 * Map Historia — etkileşimli SVG harita (AC 1.2, 3.2).
 * Eyalet sahipliği değiştiğinde ilgili altıgen ve sınırlar anında yeniden çizilir.
 */
(function (MH) {
  'use strict';

  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs = {}, parent) => {
    const node = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    if (parent) parent.appendChild(node);
    return node;
  };
  const f = (n) => Math.round(n * 10) / 10;

  class MapView {
    constructor(svg, game, handlers = {}) {
      this.svg = svg;
      this.game = game;
      this.grid = game.grid;
      this.handlers = handlers;
      this.mode = 'political';
      this.selected = null;
      this.focusId = null; // diplomatik görünümde referans ulus
      this.dirty = { fills: true, borders: true, labels: true };
      this._buildEdges();
      this._build();
      this._bindInput();
      this.resetView();

      game.on('province', ({ id }) => {
        this._fillHex(id);
        this._flash(id);
        this.dirty.borders = true;
        this.dirty.labels = true;
        this.requestRender();
      });
      game.on('wars', () => {
        if (this.mode === 'diplomatic') this.dirty.fills = true;
        this.dirty.borders = true;
        this.requestRender();
      });
      game.on('day', () => this.requestStacks());
      game.on('buildings', () => this.renderBuildings());
      game.on('month', () => {
        if (this.mode === 'diplomatic') {
          this.dirty.fills = true;
          this.requestRender();
        }
      });
    }

    // Her altıgenin 6 kenarı ve o kenarın karşısındaki komşu eyalet
    _buildEdges() {
      const { provinces, hexRadiusPx: r, hexCorners } = this.grid;
      this.edges = provinces.map((p) => {
        const c = hexCorners(p.x, p.y, r);
        const out = [];
        for (let i = 0; i < 6; i++) {
          const a = c[i];
          const b = c[(i + 1) % 6];
          const ex = p.x + (a[0] + b[0] - 2 * p.x);
          const ey = p.y + (a[1] + b[1] - 2 * p.y);
          let nb = null;
          for (const n of p.neighbors) {
            const q = provinces[n];
            if (Math.abs(q.x - ex) < 3 && Math.abs(q.y - ey) < 3) { nb = n; break; }
          }
          out.push({ a, b, nb });
        }
        return out;
      });
    }

    _build() {
      const svg = this.svg;
      svg.innerHTML = '';
      svg.setAttribute('xmlns', NS);
      const defs = el('defs', {}, svg);
      const pat = el('pattern', { id: 'hatch', width: 6, height: 6, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, defs);
      el('line', { x1: 0, y1: 0, x2: 0, y2: 6, stroke: 'rgba(160,20,20,.55)', 'stroke-width': 2.2 }, pat);
      const grad = el('radialGradient', { id: 'sea', cx: '50%', cy: '45%', r: '75%' }, defs);
      el('stop', { offset: '0%', 'stop-color': 'var(--sea-1)' }, grad);
      el('stop', { offset: '100%', 'stop-color': 'var(--sea-2)' }, grad);

      this.root = el('g', {}, svg);
      el('rect', { x: -2000, y: -2000, width: this.grid.width + 4000, height: this.grid.height + 4000, fill: 'url(#sea)' }, this.root);
      this.hexLayer = el('g', { class: 'hexes' }, this.root);
      const r = this.grid.hexRadiusPx + 0.35;
      this.hexEls = this.grid.provinces.map((p) => {
        const pts = this.grid.hexCorners(p.x, p.y, r).map((c) => f(c[0]) + ',' + f(c[1])).join(' ');
        return el('polygon', { points: pts, 'data-id': p.id, class: 'hex' }, this.hexLayer);
      });
      this.warLayer = el('path', { class: 'war-hatch', fill: 'url(#hatch)' }, this.root);
      this.coastPath = el('path', { class: 'coast' }, this.root);
      this.borderPath = el('path', { class: 'borders' }, this.root);
      this.enemyPath = el('path', { class: 'enemy-outline' }, this.root);
      this.playerPath = el('path', { class: 'player-outline' }, this.root);
      this.selectPath = el('path', { class: 'select-outline' }, this.root);
      this.buildingLayer = el('g', { class: 'buildings' }, this.root);
      this.capitalLayer = el('g', { class: 'capitals' }, this.root);
      this.labelLayer = el('g', { class: 'labels' }, this.root);
      this.pathLayer = el('g', { class: 'army-paths' }, this.root);
      this.stackLayer = el('g', { class: 'stacks' }, this.root);

      let coast = '';
      this.edges.forEach((edges) => {
        for (const e of edges) if (e.nb === null) coast += 'M' + f(e.a[0]) + ' ' + f(e.a[1]) + 'L' + f(e.b[0]) + ' ' + f(e.b[1]);
      });
      this.coastPath.setAttribute('d', coast);
      this.requestRender();
    }

    // ------------------------------------------------------------ çizim
    requestRender() {
      if (this._raf) return;
      const raf = typeof requestAnimationFrame === 'function' ? requestAnimationFrame : (fn) => setTimeout(fn, 16);
      this._raf = raf(() => {
        this._raf = null;
        this.render();
      });
    }

    render() {
      if (this.dirty.fills) {
        this.grid.provinces.forEach((p) => this._fillHex(p.id));
        this.dirty.fills = false;
      }
      if (this.dirty.borders) {
        this._renderBorders();
        this.dirty.borders = false;
      }
      if (this.dirty.labels) {
        this._renderLabels();
        this.renderBuildings();
        this.dirty.labels = false;
      }
    }

    colorOf(owner) {
      const g = this.game;
      if (!owner) return '#777';
      if (this.mode === 'political') return g.nation(owner).color;
      const ref = this.focusId;
      if (!ref) return g.nation(owner).color;
      if (owner === ref) return '#f4d35e';
      if (g.warBetween(ref, owner)) return '#c0392b';
      if (g.isAllied(ref, owner)) return '#3d7dd8';
      if (g.hasTrade(ref, owner)) return '#3aa17e';
      const op = g.opinion(owner, ref);
      // −100 kırmızımsı … +100 yeşilimsi
      const t = (op + 100) / 200;
      const rC = Math.round(196 - 90 * t);
      const gC = Math.round(120 + 70 * t);
      const bC = Math.round(110 + 20 * t);
      return 'rgb(' + rC + ',' + gC + ',' + bC + ')';
    }

    _fillHex(id) {
      const owner = this.game.state.owner[id];
      this.hexEls[id].setAttribute('fill', this.colorOf(owner));
    }

    _flash(id) {
      const node = this.hexEls[id];
      node.classList.remove('flash');
      // reflow ile animasyonu yeniden başlat
      void node.getBBox?.();
      node.classList.add('flash');
      setTimeout(() => node.classList.remove('flash'), 1400);
    }

    _outline(predicate) {
      let d = '';
      const owner = this.game.state.owner;
      this.edges.forEach((edges, pid) => {
        if (!predicate(owner[pid])) return;
        for (const e of edges) {
          if (e.nb !== null && predicate(owner[e.nb])) continue;
          d += 'M' + f(e.a[0]) + ' ' + f(e.a[1]) + 'L' + f(e.b[0]) + ' ' + f(e.b[1]);
        }
      });
      return d;
    }

    _renderBorders() {
      const g = this.game;
      const owner = g.state.owner;
      let d = '';
      this.edges.forEach((edges, pid) => {
        for (const e of edges) {
          if (e.nb === null || e.nb < pid || owner[e.nb] === owner[pid]) continue;
          d += 'M' + f(e.a[0]) + ' ' + f(e.a[1]) + 'L' + f(e.b[0]) + ' ' + f(e.b[1]);
        }
      });
      this.borderPath.setAttribute('d', d);

      const pid = g.state.playerId;
      this.playerPath.setAttribute('d', pid ? this._outline((o) => o === pid) : '');
      const enemies = new Set(pid ? g.enemiesOf(pid) : []);
      this.enemyPath.setAttribute('d', enemies.size ? this._outline((o) => enemies.has(o)) : '');

      // Oyuncunun düşmanlarının toprakları taralı gösterilir
      let hatch = '';
      if (enemies.size) {
        const r = this.grid.hexRadiusPx + 0.35;
        this.grid.provinces.forEach((p) => {
          if (!enemies.has(owner[p.id])) return;
          const c = this.grid.hexCorners(p.x, p.y, r);
          hatch += 'M' + c.map((pt) => f(pt[0]) + ' ' + f(pt[1])).join('L') + 'Z';
        });
      }
      this.warLayer.setAttribute('d', hatch);
      this.selectPath.setAttribute('d', this.selected && this.selected !== pid ? this._outline((o) => o === this.selected) : '');
    }

    _renderLabels() {
      const g = this.game;
      const { provinces } = this.grid;
      const owner = g.state.owner;
      this.labelLayer.innerHTML = '';
      this.capitalLayer.innerHTML = '';
      for (const nat of g.aliveNations()) {
        // En büyük bitişik toprak parçasının ağırlık merkezine yaz
        const mine = new Set(g.provincesOf(nat.id));
        let best = [];
        const seen = new Set();
        for (const start of mine) {
          if (seen.has(start)) continue;
          const comp = [];
          const stack = [start];
          seen.add(start);
          while (stack.length) {
            const cur = stack.pop();
            comp.push(cur);
            for (const nb of provinces[cur].neighbors) if (mine.has(nb) && !seen.has(nb)) { seen.add(nb); stack.push(nb); }
          }
          if (comp.length > best.length) best = comp;
        }
        if (!best.length) continue;
        const cx = best.reduce((s, i) => s + provinces[i].x, 0) / best.length;
        const cy = best.reduce((s, i) => s + provinces[i].y, 0) / best.length;
        const size = Math.max(6, Math.min(17, Math.sqrt(best.length) * 2.4));
        if (best.length >= 2) {
          const t = el('text', { x: f(cx), y: f(cy), 'font-size': f(size), class: 'nation-label' + (nat.id === g.state.playerId ? ' is-player' : '') }, this.labelLayer);
          t.textContent = nat.name;
        }
        const cap = provinces[nat.capital];
        if (cap && owner[nat.capital] === nat.id) {
          el('circle', { cx: f(cap.x), cy: f(cap.y), r: 2.6, class: 'capital' + (nat.id === g.state.playerId ? ' is-player' : '') }, this.capitalLayer);
        }
      }
    }

    // ------------------------------------------------------------ ordular
    requestStacks() {
      if (this._stackRaf) return;
      const raf = typeof requestAnimationFrame === 'function' ? requestAnimationFrame : (fn) => setTimeout(fn, 16);
      this._stackRaf = raf(() => {
        this._stackRaf = null;
        this.renderStacks();
      });
    }

    selectStack(id) {
      this.selectedStack = id;
      this.renderStacks();
    }

    renderStacks() {
      const g = this.game;
      const stacks = g.state.stacks || [];
      const { provinces } = this.grid;
      const pid = g.state.playerId;
      this.stackLayer.innerHTML = '';
      this.pathLayer.innerHTML = '';
      const slot = new Map();
      for (const s of stacks) {
        const p = provinces[s.prov];
        const k = slot.get(s.prov) || 0;
        slot.set(s.prov, k + 1);
        // Simgeler altıgenin alt yarısında durur; üst yarı eyalete tıklamak için açık kalır
        const x = p.x + (k % 2 ? 1 : -1) * (k ? 6 : 0);
        const y = p.y + 5 + Math.floor(k / 2) * 9;
        const mine = s.owner === pid;
        if (mine && s.path.length) {
          const pts = [[p.x, p.y], ...s.path.map((i) => [provinces[i].x, provinces[i].y])];
          el('polyline', {
            points: pts.map((q) => f(q[0]) + ',' + f(q[1])).join(' '),
            class: 'army-path' + (s.id === this.selectedStack ? ' selected' : ''),
          }, this.pathLayer);
          const end = pts[pts.length - 1];
          el('circle', { cx: f(end[0]), cy: f(end[1]), r: 2.4, class: 'army-path-end' }, this.pathLayer);
        }
        const st = MH.armies.status(g, s);
        const cls = ['stack', mine ? 'mine' : 'foe', st.kind, s.id === this.selectedStack ? 'selected' : '', s.auto && mine ? 'auto' : '']
          .filter(Boolean).join(' ');
        const node = el('g', { class: cls, 'data-stack': s.id, transform: 'translate(' + f(x) + ',' + f(y) + ')' }, this.stackLayer);
        el('rect', { x: -10, y: -5.5, width: 20, height: 11, rx: 3, fill: g.nation(s.owner).color }, node);
        const t = el('text', { x: 0, y: 0.5 }, node);
        t.textContent = s.size >= 1 ? Math.round(s.size) + 'k' : '<1k';
        if (st.kind === 'siege') {
          const sg = g.state.sieges[s.prov];
          const pct = Math.min(1, sg.progress / sg.needed);
          el('rect', { x: -10, y: 6, width: 20, height: 2.6, class: 'siege-bg' }, node);
          el('rect', { x: -10, y: 6, width: f(20 * pct), height: 2.6, class: 'siege-fg' }, node);
        }
      }
    }

    /** Kaleler (tüm uluslar) ve oyuncunun süren inşaatları */
    renderBuildings() {
      const g = this.game;
      const { provinces } = this.grid;
      this.buildingLayer.innerHTML = '';
      for (const [pid, list] of Object.entries(g.state.buildings || {})) {
        if (!list.includes('fort')) continue;
        const p = provinces[pid];
        el('path', { d: 'M' + f(p.x + 4) + ' ' + f(p.y + 7) + 'h7v-6h-1.4v1.6h-1.4v-1.6h-1.4v1.6h-1.4v-1.6h-1.4z', class: 'fort-mark' }, this.buildingLayer);
      }
      for (const c of g.state.construction || []) {
        if (c.owner !== g.state.playerId) continue;
        const p = provinces[c.pid];
        el('circle', { cx: f(p.x - 6), cy: f(p.y + 5), r: 2.2, class: 'construction-mark' }, this.buildingLayer);
      }
    }

    setMode(mode) {
      this.mode = mode;
      this.dirty.fills = true;
      this.requestRender();
    }

    setFocus(id) {
      this.focusId = id;
      if (this.mode === 'diplomatic') {
        this.dirty.fills = true;
        this.requestRender();
      }
    }

    select(id) {
      this.selected = id;
      this.dirty.borders = true;
      this.requestRender();
    }

    refreshAll() {
      this.dirty = { fills: true, borders: true, labels: true };
      this.requestRender();
      this.requestStacks();
    }

    // ------------------------------------------------------------ yakınlaştırma ve kaydırma
    resetView() {
      this.view = { x: 0, y: 0, w: this.grid.width, h: this.grid.height };
      this._applyView();
    }

    focusOn(id, zoom = 2.2) {
      const ids = this.game.provincesOf(id);
      if (!ids.length) return;
      const ps = ids.map((i) => this.grid.provinces[i]);
      const minX = Math.min(...ps.map((p) => p.x));
      const maxX = Math.max(...ps.map((p) => p.x));
      const minY = Math.min(...ps.map((p) => p.y));
      const maxY = Math.max(...ps.map((p) => p.y));
      const w = Math.max(this.grid.width / zoom, (maxX - minX) * 1.6);
      const h = w * (this.grid.height / this.grid.width);
      this.view = { x: (minX + maxX) / 2 - w / 2, y: (minY + maxY) / 2 - h / 2, w, h };
      this._clampView();
      this._applyView();
    }

    zoom(factor, cx, cy) {
      const v = this.view;
      const nw = Math.min(this.grid.width * 1.2, Math.max(this.grid.width / 8, v.w / factor));
      const nh = nw * (v.h / v.w);
      if (cx === undefined) { cx = v.x + v.w / 2; cy = v.y + v.h / 2; }
      const rx = (cx - v.x) / v.w;
      const ry = (cy - v.y) / v.h;
      this.view = { x: cx - rx * nw, y: cy - ry * nh, w: nw, h: nh };
      this._clampView();
      this._applyView();
    }

    _clampView() {
      const v = this.view;
      const W = this.grid.width;
      const H = this.grid.height;
      v.x = Math.min(Math.max(v.x, -v.w * 0.4), W - v.w * 0.6);
      v.y = Math.min(Math.max(v.y, -v.h * 0.4), H - v.h * 0.6);
    }

    _applyView() {
      const v = this.view;
      this.svg.setAttribute('viewBox', f(v.x) + ' ' + f(v.y) + ' ' + f(v.w) + ' ' + f(v.h));
      this.svg.classList.toggle('zoomed', v.w < this.grid.width * 0.6);
    }

    _toMap(evt) {
      const rect = this.svg.getBoundingClientRect();
      const v = this.view;
      // preserveAspectRatio "xMidYMid meet" dönüşümü
      const scale = Math.min(rect.width / v.w, rect.height / v.h);
      const ox = (rect.width - v.w * scale) / 2;
      const oy = (rect.height - v.h * scale) / 2;
      return { x: v.x + (evt.clientX - rect.left - ox) / scale, y: v.y + (evt.clientY - rect.top - oy) / scale, scale };
    }

    _bindInput() {
      const svg = this.svg;
      let drag = null;
      svg.addEventListener('wheel', (e) => {
        e.preventDefault();
        const p = this._toMap(e);
        this.zoom(e.deltaY < 0 ? 1.2 : 1 / 1.2, p.x, p.y);
      }, { passive: false });
      svg.addEventListener('pointerdown', (e) => {
        if (e.button !== 0) return;
        const p = this._toMap(e);
        drag = { sx: e.clientX, sy: e.clientY, vx: this.view.x, vy: this.view.y, scale: p.scale, moved: false };
      });
      window.addEventListener('pointermove', (e) => {
        if (drag) {
          const dx = e.clientX - drag.sx;
          const dy = e.clientY - drag.sy;
          if (Math.abs(dx) + Math.abs(dy) > 5) drag.moved = true;
          if (drag.moved) {
            this.view.x = drag.vx - dx / drag.scale;
            this.view.y = drag.vy - dy / drag.scale;
            this._clampView();
            this._applyView();
            svg.classList.add('dragging');
          }
        }
      });
      window.addEventListener('pointerup', (e) => {
        if (!drag) return;
        const wasDrag = drag.moved;
        drag = null;
        svg.classList.remove('dragging');
        if (wasDrag) return;
        const stackEl = e.target.closest?.('.stack');
        if (stackEl && svg.contains(stackEl)) {
          this.handlers.onStackClick?.(Number(stackEl.getAttribute('data-stack')));
          return;
        }
        const target = e.target.closest?.('.hex');
        if (target && svg.contains(target)) {
          const pid = Number(target.getAttribute('data-id'));
          this.handlers.onClick?.(pid, this.game.state.owner[pid]);
        }
      });
      svg.addEventListener('pointermove', (e) => {
        if (drag?.moved) return;
        const stackEl = e.target.closest?.('.stack');
        if (stackEl) {
          this.handlers.onStackHover?.(Number(stackEl.getAttribute('data-stack')), e);
          return;
        }
        const target = e.target.closest?.('.hex');
        if (target) {
          const pid = Number(target.getAttribute('data-id'));
          this.handlers.onHover?.(pid, this.game.state.owner[pid], e);
        } else this.handlers.onHover?.(null, null, e);
      });
      svg.addEventListener('pointerleave', (e) => this.handlers.onHover?.(null, null, e));
    }
  }

  MH.MapView = MapView;
})((globalThis.MH = globalThis.MH || {}));

</script>
  <script>
/*
 * Map Historia — arayüz.
 * Ana menü (AC 1.1) → ulus seçimi (AC 1.2, 1.3) → oyun ekranı (AC 2–4).
 */
(function (MH) {
  'use strict';

  const SAVE_KEY = 'mapHistoria.save.v1';
  const $ = (sel, root = document) => root.querySelector(sel);
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const soldiers = (k) => Math.round(k * 1000).toLocaleString('tr-TR');
  const num = (v) => (Math.round(v * 10) / 10).toLocaleString('tr-TR');
  const signed = (v) => (v > 0 ? '+' : v < 0 ? '−' : '±') + num(Math.abs(v));
  const storage = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch { return false; } },
  };

  /** [etiket, değer, birim] → { text, tone } */
  function formatEffect([label, value, unit]) {
    if (value === null || value === undefined) return { text: label, tone: 'info' };
    if (unit === 'abs') return { text: label + ': ' + num(value), tone: 'info' };
    let v;
    if (unit === 'k') v = (value > 0 ? '+' : '−') + soldiers(Math.abs(value));
    else if (unit === '%') v = (value > 0 ? '+%' : '−%') + Math.abs(value);
    else if (unit === 'pp') v = signed(value) + ' puan';
    else v = signed(value);
    let good = value > 0;
    if (/yorgunluğu/i.test(label)) good = !good;
    const tone = /Vergi/.test(label) ? 'info' : good ? 'good' : 'bad';
    return { text: label + ' ' + v, tone };
  }

  function effectList(effects) {
    if (!effects?.length) return '';
    return '<ul class="fx">' + effects.map((e) => {
      const { text, tone } = formatEffect(e);
      return '<li class="' + tone + '">' + esc(text) + '</li>';
    }).join('') + '</ul>';
  }

  function opinionClass(v) {
    if (v >= 40) return 'good';
    if (v <= -30) return 'bad';
    return 'info';
  }

  function stabilityTone(v) {
    return v >= 60 ? 'good' : v >= 35 ? 'warn' : 'bad';
  }

  class App {
    constructor() {
      this.game = null;
      this.map = null;
      this.mode = 'menu';
      this.selected = null;
      this.tab = 'overview';
      this.resumeSpeed = 1;
      this._loop = this._loop.bind(this);
      this._bindStatic();
      this.showMenu();
    }

    // ============================================================ menü (AC 1.1)
    showMenu() {
      this.mode = 'menu';
      if (this.game) this.game.state.speed = 0;
      $('#screen-game').hidden = true;
      $('#screen-menu').hidden = false;
      const list = $('#scenario-list');
      list.innerHTML = MH.SCENARIOS.map((sc) => `
        <article class="scenario-card" data-id="${sc.id}" tabindex="0" role="button" aria-label="${esc(sc.title)} senaryosunu seç">
          <div class="sc-year">${sc.year}</div>
          <div class="sc-body">
            <h3>${esc(sc.title)}</h3>
            <p class="sc-sub">${esc(sc.subtitle)} · ${esc(MH.util.formatDay(MH.util.parseDay(sc.startDate)))}</p>
            <p class="sc-desc">${esc(sc.description)}</p>
            <div class="sc-foot"><span>${sc.nations.length} oynanabilir ulus</span><span class="sc-go">Dönemi seç →</span></div>
          </div>
        </article>`).join('');
      list.querySelectorAll('.scenario-card').forEach((card) => {
        const go = () => this.startScenario(card.dataset.id);
        card.addEventListener('click', go);
        card.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
      });
      const save = storage.get(SAVE_KEY);
      const btn = $('#btn-continue');
      btn.hidden = !save;
      if (save) {
        try {
          const st = JSON.parse(save);
          const nat = st.nations[st.playerId];
          btn.textContent = 'Devam et: ' + nat.name + ' · ' + MH.util.formatDay(st.day);
        } catch {
          btn.hidden = true;
        }
      }
    }

    startScenario(id) {
      this._setGame(MH.Game.create(id));
      this.mode = 'pick';
      this.selected = null;
      this._enterGameScreen();
      this.renderPick();
    }

    continueSaved(json = storage.get(SAVE_KEY)) {
      try {
        this._setGame(MH.Game.load(json));
      } catch (err) {
        this.toast('Kayıt yüklenemedi: ' + err.message, [], 'bad');
        return;
      }
      this._enterGameScreen();
      this.startPlay(true);
    }

    _setGame(game) {
      this.game = game;
      const svg = $('#map');
      this.map = new MH.MapView(svg, game, {
        onClick: (pid, owner) => this.onMapClick(pid, owner),
        onHover: (pid, owner, e) => this.onMapHover(pid, owner, e),
        onStackClick: (sid) => this.onStackClick(sid),
        onStackHover: (sid, e) => this.onStackHover(sid, e),
      });
      game.on('event', ({ prevSpeed }) => {
        if (prevSpeed > 0) this._resumeAfterEvent = true;
        this.showEvent();
      });
      game.on('speed', () => this.renderSpeed());
      game.on('gameover', () => this.showGameOver());
      game.on('world', ({ event, nationId, result }) => {
        this.toast(event.icon + ' ' + event.title, [[game.nation(nationId).name + ': ' + result.message, null]], 'world');
      });
      game.on('log', (entry) => {
        if (this.mode === 'play' && entry.type === 'war' && entry.nations.includes(game.state.playerId) === false) {
          // dünya savaşlarını kısa bildirim olarak göster
          if (/savaş ilan etti/.test(entry.text)) this.toast('⚔️ ' + entry.text, [], 'world');
        }
        if (this.tab === 'log') this._dirtySide = true;
      });
      game.on('battle', ({ winner, loser, lossL }) => {
        const pid = game.state.playerId;
        const won = winner === pid;
        const other = game.nation(won ? loser : winner).name;
        this.flashBattle(won ? '🏆 ' + other + ' ordusu yenildi (−' + soldiers(lossL) + ')' : '💥 ' + other + ' karşısında yenilgi (−' + soldiers(lossL) + ')', won);
      });
      game.on('month', () => { this._dirtySide = true; });
      game.on('siege', ({ by, province }) => this.toast('🏰 ' + MH.places.nameOf(game, province) + ' kuşatma altında', [[game.nation(by).name + ' kuşatıyor. Ordularınızı gönderin!', null]], 'bad'));
      game.on('buildings', ({ completed }) => {
        if (completed && completed.owner === game.state.playerId) {
          const def = MH.BUILDINGS[completed.type];
          this.toast(def.icon + ' ' + def.label + ' tamamlandı', [[MH.places.nameOf(game, completed.pid), null]], 'good');
        }
        this._dirtySide = true;
      });
      game.on('goal', (goal) => this.toast('🎯 Hedef tamamlandı', [[goal.label, null]], 'good'));
      game.on('scenarioEnd', () => this.showEnding());
      game.on('province', () => { this._dirtySide = true; });
    }

    _enterGameScreen() {
      $('#screen-menu').hidden = true;
      $('#screen-game').hidden = false;
      $('#map-mode').value = 'political';
      this.map.setMode('political');
    }

    // ============================================================ ulus seçimi (AC 1.2, 1.3)
    renderPick() {
      const g = this.game;
      document.body.dataset.mode = 'pick';
      $('#pick-panel').hidden = false;
      $('#play-panel').hidden = true;
      $('#tb-nation').innerHTML = `<div class="tb-title">${esc(g.scenario.title)}</div><div class="tb-sub">Ulusunu seç</div>`;
      $('#tb-stats').innerHTML = '<span class="hint">Haritada bir ülkeye tıkla ya da listeden bir lider seç.</span>';
      $('#tb-date').textContent = MH.util.formatDay(g.state.day);
      this.renderSpeed();

      const nations = g.aliveNations().sort((a, b) => g.provincesOf(b.id).length - g.provincesOf(a.id).length);
      const sel = this.selected ? g.summary(this.selected) : null;
      $('#pick-panel').innerHTML = `
        <div class="panel-head">
          <button class="btn small ghost" id="pick-back">← Dönemler</button>
          <h2>${g.scenario.year} · ${esc(g.scenario.title)}</h2>
        </div>
        ${sel ? this._summaryHtml(sel, true, this._goalsHtml(MH.goals.goalsFor(g, sel.id), false)) : '<p class="muted pad">Kontrol etmek istediğiniz ülkeyi seçin. Büyük güçler daha kolay, küçük devletler daha zorlu bir başlangıç sunar.</p>'}
        <h3 class="list-title">Uluslar ve liderler</h3>
        <ul class="nation-list">
          ${nations.map((n) => `
            <li class="${n.id === this.selected ? 'active' : ''}" data-id="${n.id}" tabindex="0">
              <span class="swatch" style="background:${n.color}"></span>
              <span class="nl-name">${esc(n.name)}<small>${esc(n.leader)}</small></span>
              <span class="nl-meta">${g.provincesOf(n.id).length} eyalet</span>
            </li>`).join('')}
        </ul>`;
      $('#pick-back').addEventListener('click', () => this.showMenu());
      $('#pick-start')?.addEventListener('click', () => this.startPlay());
      $('#pick-panel').querySelectorAll('.nation-list li').forEach((li) => {
        const go = () => this.pickNation(li.dataset.id, true);
        li.addEventListener('click', go);
        li.addEventListener('keydown', (e) => { if (e.key === 'Enter') go(); });
      });
    }

    pickNation(id, focus = false) {
      this.selected = id;
      this.map.select(id);
      if (focus) this.map.focusOn(id, 1.8);
      this.renderPick();
      $('#pick-panel').scrollTop = 0;
    }

    _difficulty(s) {
      const score = s.provinces * 0.6 + s.army * 0.3 - s.wars.length * 15 + s.allies.length * 5 - (s.stability < 40 ? 10 : 0);
      if (score > 45) return ['Kolay', 'good'];
      if (score > 18) return ['Orta', 'warn'];
      return ['Zor', 'bad'];
    }

    _summaryHtml(s, pickMode, extra = '') {
      const [diff, diffTone] = this._difficulty(s);
      const chips = (arr, tone) => (arr.length ? arr.map((x) => `<span class="chip ${tone}">${esc(x)}</span>`).join('') : '<span class="muted">—</span>');
      const rel = (arr, tone) => (arr.length ? arr.map((x) => `<span class="chip ${tone}">${esc(x.name)} <b>${x.value > 0 ? '+' : ''}${x.value}</b></span>`).join('') : '<span class="muted">—</span>');
      return `
        <div class="summary">
          <div class="sum-head" style="--nc:${s.color}">
            <div class="banner"></div>
            <div>
              <h2>${esc(s.name)}</h2>
              <p>${esc(s.leader)}${pickMode ? ` · Zorluk: <span class="tone-${diffTone}">${diff}</span>` : ''}</p>
            </div>
          </div>
          <h4>Kaynaklar</h4>
          <dl class="stat-grid">
            <div><dt>Hazine</dt><dd>${num(s.gold)} <small>altın</small></dd></div>
            <div><dt>Aylık gelir</dt><dd class="tone-${s.budget.total >= 0 ? 'good' : 'bad'}">${signed(s.budget.total)}</dd></div>
            <div><dt>Eyaletler</dt><dd>${s.provinces}</dd></div>
            <div><dt>Gelişim</dt><dd>${s.development}</dd></div>
            <div><dt>İstikrar</dt><dd class="tone-${stabilityTone(s.stability)}">${s.stability}</dd></div>
            <div><dt>Vergi</dt><dd>%${s.tax} · ${esc(MH.FOCUS[s.focus].label)}</dd></div>
          </dl>
          <h4>Askeri güç</h4>
          <dl class="stat-grid">
            <div><dt>Ordu</dt><dd>${soldiers(s.army)}</dd></div>
            <div><dt>İnsan gücü</dt><dd>${soldiers(s.manpower)}</dd></div>
            <div><dt>Güç sırası</dt><dd>${s.powerRank}. / ${s.totalNations}</dd></div>
          </dl>
          <h4>Diplomatik durum</h4>
          <div class="dip-rows">
            <div><span>Müttefikler</span><div>${chips(s.allies, 'ally')}</div></div>
            <div><span>Savaşta</span><div>${chips(s.wars, 'enemy')}</div></div>
            <div><span>Ticaret</span><div>${chips(s.trade, 'trade')}</div></div>
            <div><span>Dostlar</span><div>${rel(s.friends, 'good')}</div></div>
            <div><span>Rakipler</span><div>${rel(s.rivals, 'bad')}</div></div>
            <div><span>Komşular</span><div>${chips(s.neighbors.slice(0, 8), '')}${s.neighbors.length > 8 ? ' <span class="muted">+' + (s.neighbors.length - 8) + '</span>' : ''}</div></div>
          </div>
          ${extra}
          ${pickMode ? `<button class="btn primary wide" id="pick-start">▶ ${esc(s.name)} olarak başla</button>` : ''}
        </div>`;
    }

    // ============================================================ oyun
    startPlay(loaded = false) {
      const g = this.game;
      if (!loaded) g.setPlayer(this.selected);
      this.mode = 'play';
      document.body.dataset.mode = 'play';
      this.selected = null;
      this.target = null;
      this.selectedStack = null;
      this.provinceSel = null;
      $('#order-hint').hidden = true;
      this.tab = 'overview';
      this.map.select(null);
      this.map.setFocus(g.state.playerId);
      this.map.refreshAll();
      this.map.focusOn(g.state.playerId, 1.6);
      $('#pick-panel').hidden = true;
      $('#play-panel').hidden = false;
      this.renderTopbar();
      this.renderSide();
      this.renderSpeed();
      if (!loaded) {
        MH.events.checkScheduled(g);
        this.toast('Hoş geldiniz, ' + g.player.leader, [['Oyunu başlatmak için ▶ düğmesine veya Boşluk tuşuna basın.', null]], 'info');
      }
      if (g.currentEvent()) this.showEvent();
      this._last = performance.now();
      this._acc = 0;
      if (!this._running) {
        this._running = true;
        requestAnimationFrame(this._loop);
      }
    }

    // Zaman akışı (AC 3.1)
    _loop(now) {
      const g = this.game;
      const dt = Math.min(250, now - (this._last || now));
      this._last = now;
      if (this.mode === 'play' && g && g.state.speed > 0 && !g.currentEvent() && !g.state.gameOver) {
        this._acc += dt;
        const ms = g.msPerDay();
        let n = 0;
        while (this._acc >= ms && n < 8 && g.state.speed > 0 && !g.currentEvent()) {
          g.tick();
          this._acc -= ms;
          n++;
        }
        if (n) {
          this.renderTopbar();
          if (this._dirtySide || now - (this._lastSide || 0) > 1000) {
            this.renderSide();
            this._lastSide = now;
            this._dirtySide = false;
          }
        }
      } else this._acc = 0;
      requestAnimationFrame(this._loop);
    }

    setSpeed(speed) {
      const g = this.game;
      if (this.mode !== 'play' || !g) return;
      if (speed > 0 && g.currentEvent()) {
        this.showEvent();
        return;
      }
      g.setSpeed(speed);
      if (speed > 0) this.resumeSpeed = speed;
    }

    togglePause() {
      if (!this.game) return;
      this.setSpeed(this.game.state.speed > 0 ? 0 : this.resumeSpeed || 1);
    }

    renderSpeed() {
      const speed = this.game?.state.speed ?? 0;
      document.querySelectorAll('.speed button').forEach((b) => {
        b.classList.toggle('active', Number(b.dataset.speed) === speed);
        b.disabled = this.mode !== 'play';
      });
      $('#screen-game').classList.toggle('paused', speed === 0 && this.mode === 'play');
    }

    renderTopbar() {
      const g = this.game;
      const p = g.player;
      if (!p) return;
      const b = g.budget(p.id);
      $('#tb-nation').innerHTML = `<span class="tb-flag" style="background:${p.color}"></span><div><div class="tb-title">${esc(p.name)}</div><div class="tb-sub">${esc(p.leader)}</div></div>`;
      const stab = Math.round(p.stability);
      $('#tb-stats').innerHTML = `
        <span class="stat" title="Hazine · aylık: vergi ${num(b.tax)} + ticaret ${num(b.trade)} − ordu ${num(b.upkeep)}">💰 <b class="${p.gold < 0 ? 'tone-bad' : ''}">${num(Math.round(p.gold))}</b> <small class="tone-${b.total >= 0 ? 'good' : 'bad'}">${signed(b.total)}/ay</small></span>
        <span class="stat" title="İnsan gücü (en fazla ${soldiers(g.maxManpower(p.id))})">👥 <b>${soldiers(p.manpower)}</b></span>
        <span class="stat" title="Ordu büyüklüğü">⚔️ <b>${soldiers(p.army)}</b></span>
        <span class="stat" title="İstikrar (hedef ${g.stabilityTarget(p.id)})">⚖️ <b class="tone-${stabilityTone(stab)}">${stab}</b></span>
        ${p.warExhaustion >= 1 ? `<span class="stat" title="Savaş yorgunluğu">🏳️ <b class="tone-bad">${Math.round(p.warExhaustion)}</b></span>` : ''}
        ${g.warsOf(p.id).length ? `<span class="stat at-war" title="Aktif savaşlar">🔥 ${g.warsOf(p.id).length} savaş</span>` : ''}`;
      $('#tb-date').textContent = MH.util.formatDay(g.state.day);
    }

    renderSide() {
      const g = this.game;
      if (!g.player) return;
      document.querySelectorAll('.tabs button').forEach((b) => b.classList.toggle('active', b.dataset.tab === this.tab));
      const body = $('#tab-body');
      const scroll = body.scrollTop;
      const html = {
        overview: () => this._overviewTab(),
        economy: () => this._economyTab(),
        military: () => this._militaryTab(),
        diplomacy: () => this._diplomacyTab(),
        log: () => this._logTab(),
      }[this.tab]();
      // Kaydırıcı sürüklenirken yeniden çizmeyi atla
      if (body.contains(document.activeElement) && document.activeElement.type === 'range') return;
      body.innerHTML = html;
      body.scrollTop = scroll;
      this._bindTab();
    }

    _overviewTab() {
      const g = this.game;
      const ended = g.state.ended && !g.state.gameOver
        ? `<button class="btn wide" data-act="showEnding">📜 Senaryo sonucunu yeniden gör</button>` : '';
      const prov = this.provinceSel !== undefined && this.provinceSel !== null && g.state.owner[this.provinceSel] === g.state.playerId
        ? this._provinceHtml(this.provinceSel, true) : '';
      return prov + this._summaryHtml(g.summary(g.state.playerId), false, this._goalsHtml(g.state.goals, true) + ended) +
        `<p class="muted pad small">İpucu: Kendi eyaletinize tıklayarak yapı inşa edin; başka bir ülkeye tıklayarak diplomasi ekranını açın. "Diplomatik" harita modu komşularınızın tutumunu gösterir.</p>`;
    }

    // AC 2.1 — ekonomi
    _economyTab() {
      const g = this.game;
      const p = g.player;
      const b = g.budget(p.id);
      const wait = Math.max(0, Math.ceil(p.focusChangedDay + 180 - g.state.day));
      return `
        <section class="card">
          <h3>Vergi oranı</h3>
          <div class="tax-row">
            <input type="range" id="tax" min="0" max="50" step="5" value="${p.tax}" aria-label="Vergi oranı">
            <output id="tax-out">%${p.tax}</output>
          </div>
          <p class="muted small" id="tax-preview">Vergi artışı anında istikrarı düşürür (her 5 puan için −2), indirim ise artırır. Yüksek vergi uzun vadede istikrar hedefini düşürür.</p>
        </section>
        <section class="card">
          <h3>Aylık bütçe</h3>
          <table class="budget">
            <tr><td>Vergi geliri</td><td class="tone-good">+${num(b.tax)}</td></tr>
            <tr><td>Ticaret anlaşmaları (${p.trade.length})</td><td class="tone-good">+${num(b.trade)}</td></tr>
            <tr><td>Pazarlar (${g.buildingsOf(p.id, 'market').length})</td><td class="tone-good">+${num(b.buildings)}</td></tr>
            <tr><td>Ordu ve kale bakımı</td><td class="tone-bad">−${num(b.upkeep)}</td></tr>
            <tr class="total"><td>Net</td><td class="tone-${b.total >= 0 ? 'good' : 'bad'}">${signed(b.total)}</td></tr>
          </table>
          <p class="muted small">İstikrar hedefi: <b>${g.stabilityTarget(p.id)}</b> · İnsan gücü artışı: +${soldiers(g.manpowerGrowth(p.id))}/ay</p>
        </section>
        ${this._buildingsSummaryHtml()}
        <section class="card">
          <h3>Halkın gönlü</h3>
          ${(() => {
            const wait = Math.max(0, Math.ceil((p.festivalDay ?? -Infinity) + 365 - g.state.day));
            const cost = g.festivalCost(p.id);
            return `<div class="btn-row"><button class="btn" data-act="festival" ${wait || p.gold < cost ? 'disabled' : ''}>🎉 Şenlik düzenle <small>${cost} altın</small></button></div>
              <p class="muted small">${wait ? 'Yeni şenlik için ' + wait + ' gün beklenmeli.' : 'İstikrar +8, savaş yorgunluğu −5. Yılda bir kez.'}</p>`;
          })()}
        </section>
        <section class="card">
          <h3>Üretim odağı</h3>
          ${wait ? `<p class="muted small">Yeni değişiklik için ${wait} gün beklenmeli.</p>` : '<p class="muted small">Odak değiştirmek istikrarı 3 puan düşürür (180 gün bekleme süresi).</p>'}
          <div class="focus-grid">
            ${Object.entries(MH.FOCUS).map(([k, v]) => `
              <button class="focus ${p.focus === k ? 'active' : ''}" data-focus="${k}" ${wait && p.focus !== k ? 'disabled' : ''}>
                <b>${v.label}</b><small>${v.desc}</small>
              </button>`).join('')}
          </div>
        </section>
        <section class="card">
          <h3>Ticaret anlaşmaları</h3>
          ${p.trade.length ? `<ul class="rows">${p.trade.map((t) => `
            <li><span class="swatch" style="background:${g.nation(t).color}"></span>${esc(g.nation(t).name)}
              <button class="btn tiny ghost" data-act="cancelTrade" data-target="${t}">İptal et</button></li>`).join('')}</ul>`
            : '<p class="muted small">Henüz ticaret anlaşmanız yok. Haritada bir ülke seçip Diplomasi sekmesinden önerin.</p>'}
        </section>`;
    }

    _buildingsSummaryHtml() {
      const g = this.game;
      const id = g.state.playerId;
      const counts = Object.entries(MH.BUILDINGS).map(([t, d]) => `<span class="chip">${d.icon} ${d.label} <b>${g.buildingsOf(id, t).length}</b></span>`).join('');
      const work = g.state.construction.filter((c) => c.owner === id);
      return `<section class="card">
        <h3>Yapılar</h3>
        <div class="flags">${counts}</div>
        ${work.length ? `<ul class="rows">${work.map((c) => `<li>🔨 ${MH.BUILDINGS[c.type].label} · ${esc(MH.places.nameOf(g, c.pid))}<span class="muted small" style="margin-left:auto">${c.done - g.state.day} gün</span></li>`).join('')}</ul>` : ''}
        <p class="muted small">İnşa etmek için haritada kendi eyaletinize tıklayın. Pazarlar zengin eyaletlerde, kaleler sınır boylarında en çok işe yarar.</p>
      </section>`;
    }

    _militaryTab() {
      const g = this.game;
      const p = g.player;
      const cost = g.recruitCost(p.id);
      const wars = g.warsOf(p.id);
      return `
        <section class="card">
          <h3>Ordu</h3>
          <dl class="stat-grid">
            <div><dt>Asker</dt><dd>${soldiers(p.army)}</dd></div>
            <div><dt>İnsan gücü</dt><dd>${soldiers(p.manpower)} <small>/ ${soldiers(g.maxManpower(p.id))}</small></dd></div>
            <div><dt>Kalite</dt><dd>×${num(g.quality(p.id))}</dd></div>
            <div><dt>Güç sırası</dt><dd>${g.powerRank(p.id)}.</dd></div>
          </dl>
          <div class="btn-row">
            ${[5, 10, 20].map((n) => `<button class="btn" data-act="recruit" data-n="${n}" ${p.manpower < n || p.gold < n * cost ? 'disabled' : ''}>+${soldiers(n)} <small>${num(n * cost)} altın</small></button>`).join('')}
            <button class="btn ghost" data-act="disband" data-n="5" ${p.army < 5 ? 'disabled' : ''}>−${soldiers(5)} terhis</button>
          </div>
          <div class="btn-row">
            <button class="btn" data-act="mercs" data-n="5" ${p.gold < 75 ? 'disabled' : ''} title="İnsan gücü gerektirmez">🗡️ Paralı asker +${soldiers(5)} <small>75 altın</small></button>
          </div>
          <p class="muted small">Her bin asker ayda 0,18 altın bakım ister. Ordu, cephe sayısına bölünerek savaşır.</p>
        </section>
        ${this._stacksHtml()}
        <section class="card">
          <h3>Savaşlar</h3>
          ${wars.length ? '<p class="muted small">Duruş, otomatik komutadaki ordularınızın davranışını belirler.</p>' : ''}
          ${wars.length ? wars.map((w) => {
            const enemy = w.a === p.id ? w.b : w.a;
            const score = g.warScore(w, p.id);
            const months = Math.floor((g.state.day - w.start) / 30);
            return `
              <div class="war">
                <div class="war-head"><span class="swatch" style="background:${g.nation(enemy).color}"></span><b>${esc(g.nation(enemy).name)}</b>
                  <span class="muted small">${months} ay · ordu ${soldiers(g.nation(enemy).army)}</span></div>
                <div class="stance" role="group" aria-label="Cephe duruşu">
                  ${Object.entries(MH.STANCES).map(([k, st]) => `<button class="${g.stanceOf(w, p.id) === k ? 'active' : ''}" data-act="stance" data-stance="${k}" data-target="${enemy}" title="${st.desc}">${st.label}</button>`).join('')}
                </div>
